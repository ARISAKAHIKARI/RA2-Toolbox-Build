name: Compile CPU area reduction improvements
on:
  push:
    branches: [codex/render-cpu-reduction-20261105]
    paths: [source/**, .github/workflows/compile-render-cpu-reduction.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-cpu-reduction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: source
      - name: Check area reduction and complete framebuffer planes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          for test in native_box_reduce native_canvas object_canvas_terrain_prefix object_cloak_replay; do
            g++ -std=c++17 -O2 -pthread "source/assist/tests/$test.cpp" source/third_party/xbrz/xbrz.cpp -ldl -o "/tmp/$test"
            if [ "$test" = object_cloak_replay ]; then
              "/tmp/$test" --correctness > "diagnostics/$test.log"
            else
              "/tmp/$test" > "diagnostics/$test.log"
            fi
            cat "diagnostics/$test.log"
          done
          g++ -std=c++17 -O2 -pthread -DRA2_CPU_AREA_CACHE_BYTES=0 source/assist/tests/native_box_reduce.cpp source/third_party/xbrz/xbrz.cpp -ldl -o /tmp/box-no-cache
          /tmp/box-no-cache > diagnostics/box-no-cache.log
          cat diagnostics/box-no-cache.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CPU-reduction-pre14-checks
          retention-days: 14
          path: diagnostics
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force artifacts/console,diagnostics | Out-Null
      - name: Compile modern x64 host and paired x86 Runtime and broker
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/artifacts/console"
          bash source/build-zig-x64.sh > diagnostics/console-build.log 2>&1 || { tail -100 diagnostics/console-build.log; exit 1; }
          tail -50 diagnostics/console-build.log
          python source/tools/verify_windows_outputs.py --root artifacts/console --host-arch x64 --webview2
      - name: Validate exact CPU reduction on Windows
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          "$ZIG" c++ -target x86_64-windows-gnu -std=c++17 -O2 source/assist/tests/native_box_reduce.cpp source/third_party/xbrz/xbrz.cpp -o diagnostics/native-box-reduce.exe -lkernel32 -luser32 -lgdi32
          diagnostics/native-box-reduce.exe > diagnostics/native-box-reduce.log
          cat diagnostics/native-box-reduce.log
      - name: Record identity and assemble update package
        shell: python
        run: |
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path('artifacts/console')
          names=['RA2Toolbox.exe','GameRuntime.dll','GameRuntimeHost32.exe','WebView2Loader.dll']
          files=[dict(name=n,bytes=(root/n).stat().st_size,sha256=hashlib.sha256((root/n).read_bytes()).hexdigest()) for n in names]
          info=dict(version='1.0.41-pre.14',commit=os.environ['GITHUB_SHA'],branch=os.environ['GITHUB_REF_NAME'],host='x64',runtime='x86',broker='x86',console='WebView2',game_tested=False,multiplayer_tested=False,files=files)
          Path('diagnostics/paired-build.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          readme='RA2 Toolbox 1.0.41-pre.14 (x64)\n\nExit both the game and toolbox before replacing all included files together. Preserve your existing INI, assets and cache. Requires Microsoft Edge WebView2 Evergreen Runtime.\n\nCorrections: faster CPU whole-map area reduction and terrain restoration; reuse unchanged terrain planning and avoid redundant ordered terrain visits. Includes previous CPU/GPU improvements, Hook recovery and attack-own-ground.\n\nCompiled from '+info['commit']+'. Real-game FPS and multiplayer acceptance remain unverified.\n'
          package=Path('artifacts/RA2Toolbox-1.0.41-pre.14-x64-Update.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n in names:z.write(root/n,n)
              for p in sorted((root/'licenses').rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(root))
              z.writestr('UPDATE_README.txt',readme)
          info['package']=dict(name=package.name,bytes=package.stat().st_size,sha256=hashlib.sha256(package.read_bytes()).hexdigest())
          Path('diagnostics/paired-build.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
      - name: Upload update package and build identity
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.41-pre.14-x64-Update
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/RA2Toolbox-1.0.41-pre.14-x64-Update.zip
            diagnostics/paired-build.json
            diagnostics/native-box-reduce.log
            artifacts/console/BUILD_SOURCE_MANIFEST.json
            artifacts/console/BUILD_TARGET.json
            artifacts/console/WINDOWS_BUILD_ARTIFACTS.json
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-render-cpu-reduction-build-log
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics/console-build.log
