name: Bootstrap Vulkan compute kernel
on:
  push:
    branches: [codex/vulkan-kernel-bootstrap-20261029]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
      - name: Compile Vulkan 1.0 SPIR-V
        run: python3 source/tools/build_vulkan_kernel.py --output generated/vulkan_bilinear_spirv.h | tee generated-kernel.json
      - name: Compile complete scene and xBRZ kernels
        run: |
          python3 source/tools/build_vulkan_scene.py --output generated/vulkan_scene_spirv.h | tee generated-scene.json
          python3 source/tools/build_gpu_xbrz.py --output generated/gpu_xbrz_spirv.h | tee generated-xbrz.json
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-bilinear-kernel
          if-no-files-found: error
          path: |
            generated/vulkan_bilinear_spirv.h
            generated-kernel.json
            generated/vulkan_scene_spirv.h
            generated/gpu_xbrz_spirv.h
            generated-scene.json
            generated-xbrz.json

  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan and shader validator
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers gdb glslang-tools spirv-tools
      - name: Regenerate and compare SPIR-V
        run: |
          python3 source/tools/build_vulkan_kernel.py --output /tmp/vulkan_bilinear_spirv.h
          cmp /tmp/vulkan_bilinear_spirv.h source/external_reader/source/vulkan_bilinear_spirv.h
      - name: Real Vulkan compute and cache regression
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -DRA2_VULKAN_TEST_SOFTWARE source/assist/tests/vulkan_compute.cpp -ldl -o /tmp/vulkan-compute-test
          ASAN_OPTIONS=detect_leaks=0 VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation /tmp/vulkan-compute-test --require 2>&1 | tee vulkan-compute.log
          python3 -c "from pathlib import Path; s=Path('vulkan-compute.log').read_text(); assert 'Validation Error' not in s and 'VUID-' not in s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-compute-validation
          if-no-files-found: warn
          path: vulkan-compute.log

  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compute tools
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools
      - name: Compile current scene shader
        run: python3 source/tools/build_vulkan_scene.py --output source/external_reader/source/vulkan_scene_spirv.h
      - name: Real GPU scene composition against CPU Surface
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -DRA2_VULKAN_TEST_SOFTWARE -fsanitize=address,undefined -fno-omit-frame-pointer source/assist/tests/vulkan_scene.cpp source/third_party/xbrz/xbrz.cpp -ldl -o /tmp/vulkan-scene-test
          ASAN_OPTIONS=detect_leaks=0 VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation /tmp/vulkan-scene-test --require 2>&1 | tee vulkan-scene.log
          python3 -c "from pathlib import Path; s=Path('vulkan-scene.log').read_text(); assert 'Validation Error' not in s and 'VUID-' not in s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-scene-validation
          if-no-files-found: warn
          path: |
            vulkan-scene.log
            source/external_reader/source/vulkan_scene_spirv.h
