name: Validate minimap borders and stable rendering
on:
  push:
    branches: [codex/fix-minimap-render-20261028]
    paths: ['source/**', '.github/workflows/validate-minimap-render-fixes.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimap-render-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendering regressions and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -c source/third_party/xbrz/xbrz.cpp -o /tmp/xbrz.o
          for name in render_upgrade render_upgrade_scene radar_scene radar_shroud_mask native_canvas native_feedback native_feedback_scene pixel_upgrade xbrz_scaling material_motion material_scene viewport_detail live_palette_cache live_scene_lighting live_voxel_scene watch_live_palette color_precision color_scene palette_recovery resolution_sampling color_reconstruction terrain_viewport minimap_overlay minimap_terrain_crop radar_boundary render_presentation render_feedback_host; do
            g++ -std=c++17 -O2 source/assist/tests/$name.cpp /tmp/xbrz.o -o /tmp/$name-test
            /tmp/$name-test
          done
          for name in render_upgrade native_feedback pixel_upgrade physical_presentation material_refresh color_resolution aircraft_allocation; do
            python3 source/tools/validate_$name.py
          done
          python3 source/assist/tests/render_presentation_gate.py
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
      - name: Real passive compositor regressions
        shell: pwsh
        run: |
          foreach($name in 'overlay_compositor_windows','native_feedback_windows','physical_presentation_windows'){
            & $env:ZIG_EXE c++ -target x86-windows-gnu -std=c++17 -O2 "source/assist/tests/$name.cpp" -o "$name-test.exe" -lgdi32 -luser32
            if($LASTEXITCODE -ne 0){throw "Compilation failed: $name"}
            & ".\$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Test failed: $name"}
          }
      - name: Stable publication and cursor regressions
        shell: pwsh
        run: |
          foreach($name in 'render_presentation','render_feedback_host'){
            & $env:ZIG_EXE c++ -target x86-windows-gnu -std=c++17 -O2 "source/assist/tests/$name.cpp" -o "$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Compilation failed: $name"}
            & ".\$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Test failed: $name"}
          }
      - name: Build and verify Win32 outputs
        working-directory: source
        shell: pwsh
        run: |
          $env:RA2_NO_PAUSE='1'
          cmd /d /c 'call BUILD_ZIG.cmd > build-minimap-render.log 2>&1'
          $status=$LASTEXITCODE
          Get-Content build-minimap-render.log -Tail 80
          if($status -ne 0){throw "Build failed: $status"}
          python tools/verify_windows_outputs.py
          if($LASTEXITCODE -ne 0){throw 'PE/version/ABI/dependency verification failed'}
      - name: Upload tested binaries
        uses: actions/upload-artifact@v4
        with:
          name: RA2-minimap-render-fixes
          if-no-files-found: error
          retention-days: 14
          path: |
            source/RA2Toolbox.exe
            source/GameRuntime.dll
            source/WINDOWS_BUILD_ARTIFACTS.json
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2-minimap-render-fix-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: source/build-minimap-render.log
