name: Validate rendering feedback, visibility and performance
on:
  push:
    branches: [codex/fix-render-feedback-20261029]
    paths: ['source/**', '.github/workflows/validate-render-feedback-fixes.yml', '.github/workflows/validate-x64-render.yml', '.github/workflows/validate-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-feedback-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vulkan-compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan and shader validator
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools
      - name: Verify all generated Vulkan kernels
        shell: bash
        run: |
          set -euo pipefail
          for kernel in 'build_vulkan_kernel:vulkan_bilinear' 'build_vulkan_scene:vulkan_scene' 'build_gpu_xbrz:gpu_xbrz' 'build_gpu_voxel_kernels:gpu_voxel' 'build_gpu_shroud:gpu_shroud' 'build_vulkan_area:vulkan_area'; do
            builder=${kernel%%:*}
            header=${kernel#*:}_spirv.h
            python3 "source/tools/$builder.py" --output "/tmp/$header"
            cmp "/tmp/$header" "source/external_reader/source/$header"
          done
      - name: Real GPU scene, xBRZ, voxel, shroud and minimap-area regressions
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -euo pipefail
          mkdir -p vulkan-logs
          flags=(-std=c++17 -O1 -g -UNDEBUG -DRA2_VULKAN_TEST_SOFTWARE -fsanitize=address,undefined -fno-omit-frame-pointer)
          g++ "${flags[@]}" -c source/third_party/xbrz/xbrz.cpp -o /tmp/xbrz-gpu.o
          for name in vulkan_compute vulkan_region vulkan_scene gpu_xbrz gpu_voxel_vulkan gpu_voxel_scene vulkan_shroud vulkan_shroud_scene gpu_scene_renderer gpu_depth_plan vulkan_shared_assets vulkan_allocation_fallback gpu_scene_record vulkan_area; do
            g++ "${flags[@]}" "source/assist/tests/$name.cpp" /tmp/xbrz-gpu.o -ldl -o "/tmp/$name-test"
            if [[ "$name" == vulkan_region ]]; then
              RA2_TEST_VULKAN_REQUIRED=1 "/tmp/$name-test" 2>&1 | tee "vulkan-logs/$name.log"
            else
              "/tmp/$name-test" --require 2>&1 | tee "vulkan-logs/$name.log"
            fi
          done
          python3 -c 'from pathlib import Path; import re; logs=list(Path("vulkan-logs").glob("*.log")); assert len(logs)==14; assert not any(re.search("Validation Error|VUID-",p.read_text()) for p in logs), "Vulkan validation errors"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vulkan-render-fix3-diagnostics
          if-no-files-found: warn
          path: vulkan-logs/*.log
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendering regressions and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -UNDEBUG -c source/third_party/xbrz/xbrz.cpp -o /tmp/xbrz.o
          for name in render_upgrade render_upgrade_scene building_transition radar_scene radar_shroud_mask native_canvas native_feedback native_feedback_scene native_local_ui pixel_upgrade xbrz_scaling material_motion material_scene viewport_detail live_palette_cache live_scene_lighting live_voxel_scene watch_live_palette color_precision color_scene palette_recovery resolution_sampling color_reconstruction terrain_viewport minimap_overlay minimap_terrain_crop radar_boundary render_presentation render_feedback_host render_scroll overlay_incremental overlay_present_rate native_order_feedback world_presentation live_shroud_scene terrain_coverage voxel_posture voxel_shadow shp_turret native_beam_effects native_effect_stencil native_unit_ui_stencil voxel_preview voxel_lighting scene_lighting watch_view watch_host watch_shroud_mask xbrz_bilinear gpu_scene_record gpu_voxel gpu_shroud gpu_scene_renderer gpu_voxel_cache gpu_depth_plan native_repaint terrain_partial_scene radar_diagram_cache radar_paint_gate native_area; do
            g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/$name.cpp /tmp/xbrz.o -ldl -o /tmp/$name-test
            /tmp/$name-test
          done
          for name in render_upgrade native_feedback pixel_upgrade physical_presentation material_refresh color_resolution aircraft_allocation; do
            python3 source/tools/validate_$name.py
          done
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/shroud_material.cpp -o /tmp/shroud-material-test
          /tmp/shroud-material-test
          g++ -std=c++17 -O2 -UNDEBUG -pthread source/unit_monitor/tests/async_sampling.cpp -o /tmp/unit-async-sampling-test
          /tmp/unit-async-sampling-test
          g++ -std=c++17 -O2 -UNDEBUG -pthread -Isource/tests/winmock source/tests/process_identity_lock.cpp -o /tmp/process-identity-lock-test
          /tmp/process-identity-lock-test
          python3 source/assist/tests/secondary_stats_test.py
          python3 source/tools/audit_architecture.py
          g++ -std=c++17 -O2 -UNDEBUG -DRA2_XBRZ_SCALAR_ONLY source/assist/tests/xbrz_bilinear.cpp /tmp/xbrz.o -o /tmp/xbrz-bilinear-scalar
          /tmp/xbrz-bilinear-scalar
          python3 source/assist/tests/gpu_xbrz_model_test.py
          python3 source/assist/tests/render_presentation_gate.py
          python3 source/assist/tests/render_material_settings.py
          python3 source/assist/tests/render_atomic_camera.py
          python3 source/assist/tests/game_assets_host_test.py
          python3 source/assist/tests/process_reader_pages_test.py
          python3 source/assist/tests/overlay_keepalive_test.py
          python3 source/assist/tests/overlay_present_monitor_test.py
          python3 source/assist/tests/construction_host_test.py
          python3 source/assist/tests/construction_paint_test.py
          python3 source/assist/tests/minimap_rate_test.py
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
      - name: Real passive compositor regressions
        shell: pwsh
        run: |
          foreach($name in 'overlay_compositor_windows','native_feedback_windows','physical_presentation_windows','overlay_stack_windows','overlay_compositor_retry_windows','construction_buffer_windows','radar_panel_windows'){
            & $env:ZIG_EXE c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG "source/assist/tests/$name.cpp" -o "$name-test.exe" -lgdi32 -luser32
            if($LASTEXITCODE -ne 0){throw "Compilation failed: $name"}
            & ".\$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Test failed: $name"}
          }
      - name: Stable publication and cursor regressions
        shell: pwsh
        run: |
          & $env:ZIG_EXE c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG -c source/third_party/xbrz/xbrz.cpp -o xbrz-test.o
          if($LASTEXITCODE -ne 0){throw 'xBRZ compilation failed'}
          foreach($name in 'native_local_ui','render_presentation','render_feedback_host','render_scroll','overlay_incremental','overlay_present_rate','native_order_feedback','world_presentation','live_shroud_scene','terrain_coverage','voxel_posture','voxel_shadow','shp_turret','native_beam_effects','native_effect_stencil','native_unit_ui_stencil','xbrz_bilinear','gpu_scene_record','gpu_voxel','gpu_shroud','gpu_scene_renderer','gpu_voxel_cache','gpu_depth_plan','native_repaint','terrain_partial_scene','vulkan_compute','vulkan_region','vulkan_scene','gpu_xbrz','gpu_voxel_vulkan','gpu_voxel_scene','vulkan_shroud','vulkan_shroud_scene','vulkan_shared_assets','vulkan_allocation_fallback','radar_diagram_cache','radar_paint_gate','native_area','vulkan_area'){
            & $env:ZIG_EXE c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG "source/assist/tests/$name.cpp" xbrz-test.o -o "$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Compilation failed: $name"}
            & ".\$name-test.exe"
            if($LASTEXITCODE -ne 0){throw "Test failed: $name"}
          }
      - name: Build and verify Win32 outputs
        working-directory: source
        shell: pwsh
        run: |
          $env:RA2_NO_PAUSE='1'
          cmd /d /c 'call BUILD_ZIG.cmd > build-render-feedback.log 2>&1'
          $status=$LASTEXITCODE
          Get-Content build-render-feedback.log -Tail 80
          if($status -ne 0){throw "Build failed: $status"}
          python tools/verify_windows_outputs.py
          if($LASTEXITCODE -ne 0){throw 'PE/version/ABI/dependency verification failed'}
      - name: Upload tested binaries
        uses: actions/upload-artifact@v4
        with:
          name: RA2-render-feedback-fix3
          if-no-files-found: error
          retention-days: 14
          path: |
            source/RA2Toolbox.exe
            source/GameRuntime.dll
            source/WINDOWS_BUILD_ARTIFACTS.json
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2-render-feedback-fix3-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: source/build-render-feedback.log
