name: Validate RA2 Toolbox 1.0.38
on:
  push:
    branches: [codex/camera-v138-pre2, codex/building-animation-fix, codex/lighting-bib-v138-pre4, codex/preview-corrections-v138-pre5, codex/formation-switch-v138-pre6, codex/info-adaptive-v138-pre7, codex/minimap-watch-v138-pre8, codex/scene-effects-v138-pre9, codex/secondary-displays-v138-pre10, codex/project-consistency-v138-pre11, codex/project-consistency-v138-pre12, codex/release-v138]
    paths: ['source/**', '.github/workflows/validate-v138-pre2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-v138-pre2
  cancel-in-progress: true
jobs:
  overlay-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build focused overlay recovery fixture
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig-overlay.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig-overlay.tar.xz' | sha256sum -c -
          tar -xf /tmp/zig-overlay.tar.xz -C /tmp
          /tmp/zig-linux-x86_64-0.13.0/zig c++ -target x86-windows-gnu -std=c++17 -O2 source/assist/tests/overlay_stack_windows.cpp -o source/overlay-stack-test.exe -luser32
          /tmp/zig-linux-x86_64-0.13.0/zig c++ -target x86-windows-gnu -std=c++17 -O2 source/assist/tests/frame_clock_shutdown_windows.cpp -o source/frame-clock-shutdown-test.exe -luser32
      - uses: actions/upload-artifact@v4
        with:
          name: camera138final-overlay
          path: |
            source/overlay-stack-test.exe
            source/frame-clock-shutdown-test.exe
          retention-days: 7
  overlay-windows:
    needs: overlay-build
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: camera138final-overlay
          path: source
      - name: Real overlay window stacking with bounded owner-thread waits
        run: .\\source\\overlay-stack-test.exe
      - name: Clock shutdown waits for its worker before closing event handles
        run: .\\source\\frame-clock-shutdown-test.exe
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check settings, display and formation regressions
        run: |
          set -euo pipefail
          python3 source/assist/tests/auto_settings_ui_test.py
          python3 source/assist/tests/suite_display_test.py
          python3 source/assist/tests/modern_ui_test.py
          python3 source/assist/tests/cursor_settings_ui_test.py
          python3 source/assist/tests/ui_geometry_test.py
          python3 source/assist/tests/enemy_overlay_test.py
          python3 source/assist/tests/game_assets_host_test.py
          python3 source/assist/tests/watch_windows_test.py
          python3 source/assist/tests/watch_async_test.py
          python3 source/assist/tests/watch_passenger_test.py
          python3 source/assist/tests/watch_effects_test.py
          python3 source/assist/tests/formation_switch_test.py
          python3 source/assist/tests/overlay_keepalive_test.py
          python3 source/assist/tests/secondary_display_test.py
          python3 source/assist/tests/secondary_stats_test.py
          python3 source/assist/tests/secondary_display_host_test.py
          python3 source/assist/tests/monitor_refresh_test.py
          python3 source/assist/tests/information_refresh_test.py
          python3 source/assist/tests/minimap_rate_test.py
          python3 source/assist/tests/secondary_radar_drag_test.py
          python3 source/assist/tests/process_reader_pages_test.py
          python3 source/unit_monitor/tests/surface_lifecycle_test.py
          python3 source/assist/tests/world_overlay_invalidation_test.py
          python3 source/assist/tests/construction_host_test.py
          python3 source/assist/tests/construction_batch_runtime_test.py
          g++ -std=c++17 -O2 -c source/third_party/xbrz/xbrz.cpp -o /tmp/render-xbrz.o
          for test in label_motion passenger_motion pacing enemy_markers enemy_clusters watch_view watch_host watch_slots watch_shroud_mask visual_pose voxel_preview game_assets live_ini cameo_catalog camera_raster building_animations building_components voxel_lighting radar_paint_gate secondary_radar_layout radar_scene radar_shroud_mask radar_shroud_assets minimap_overlay map_bounds formation formation_host sprite_formats terrain_preview art_variants garrison_frame radar_boundary native_canvas repair_visuals projectile_visuals scene_lighting command_delivery direct_modes; do
            g++ -std=c++17 -O2 "source/assist/tests/$test.cpp" /tmp/render-xbrz.o -o "/tmp/$test"
            "/tmp/$test"
          done
          g++ -std=c++17 -O2 -pthread source/assist/tests/latest_worker.cpp -o /tmp/latest-worker
          /tmp/latest-worker
          g++ -std=c++17 -O2 source/unit_monitor/tests/cameo_palette.cpp -o /tmp/cameo-palette
          /tmp/cameo-palette
          g++ -std=c++17 -O2 source/unit_monitor/tests/round_transition.cpp -o /tmp/round-transition -pthread
          /tmp/round-transition
          g++ -std=c++17 -O2 source/unit_monitor/tests/icon_cache.cpp -o /tmp/icon-cache -pthread
          /tmp/icon-cache
          g++ -std=c++17 -O2 -pthread source/unit_monitor/tests/frame_clock.cpp -o /tmp/stats-frame-clock
          /tmp/stats-frame-clock
          python3 source/tools/audit_architecture.py
      - name: Install pinned Zig compiler
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz' | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "ZIG=/tmp/zig-linux-x86_64-0.13.0/zig" >> "$GITHUB_ENV"
      - name: Build matching EXE and Runtime
        run: bash source/build-zig.sh
      - name: Build process discovery fixture
        run: '"$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -municode source/tests/process_discovery_windows.cpp -o source/process-discovery-test.exe -luser32'
      - name: Build renderer and formation numerical fixtures with the release compiler
        run: |
          # The fixtures use assert for checks and some read/setup calls.
          # Zig's optimized Windows compile must not omit those expressions.
          printf '#include <cassert>\n#ifdef NDEBUG\n#error Windows numerical assertions are disabled\n#endif\n' > /tmp/windows-numerical-assert-probe.cpp
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG -c /tmp/windows-numerical-assert-probe.cpp -o /tmp/windows-numerical-assert-probe.o
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -c source/third_party/xbrz/xbrz.cpp -o /tmp/windows-render-xbrz.o
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/voxel_lighting.cpp -o source/voxel-lighting-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/voxel_preview.cpp -o source/voxel-preview-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/building_components.cpp -o source/building-components-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/map_bounds.cpp -o source/map-bounds-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/scene_lighting.cpp -o source/scene-lighting-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/formation.cpp -o source/formation-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/garrison_frame.cpp -o source/garrison-frame-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/radar_boundary.cpp -o source/radar-boundary-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/radar_shroud_mask.cpp -o source/radar-shroud-mask-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/radar_shroud_assets.cpp -o source/radar-shroud-assets-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/watch_shroud_mask.cpp -o source/watch-shroud-mask-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/native_canvas.cpp /tmp/windows-render-xbrz.o -o source/native-canvas-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/repair_visuals.cpp /tmp/windows-render-xbrz.o -o source/repair-visuals-test.exe
          "$ZIG" c++ -target x86-windows-gnu -std=c++17 -O2 -UNDEBUG source/assist/tests/projectile_visuals.cpp /tmp/windows-render-xbrz.o -o source/projectile-visuals-test.exe
      - name: Validate final PE files and bridge ABI
        run: python3 source/tools/verify_windows_outputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera138final-binaries
          path: |
            source/RA2Toolbox.exe
            source/GameRuntime.dll
            source/process-discovery-test.exe
            source/voxel-lighting-test.exe
            source/voxel-preview-test.exe
            source/building-components-test.exe
            source/map-bounds-test.exe
            source/scene-lighting-test.exe
            source/formation-test.exe
            source/garrison-frame-test.exe
            source/radar-boundary-test.exe
            source/radar-shroud-mask-test.exe
            source/radar-shroud-assets-test.exe
            source/watch-shroud-mask-test.exe
            source/native-canvas-test.exe
            source/repair-visuals-test.exe
            source/projectile-visuals-test.exe
            source/WINDOWS_BUILD_ARTIFACTS.json
          retention-days: 7
  windows-ui:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camera138final-binaries
          path: source
      - name: Real Ares and spawn process discovery
        run: .\\source\\process-discovery-test.exe
      - name: Renderer, map bounds and formation geometry on Windows x86
        run: |
          .\source\voxel-lighting-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\voxel-preview-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\building-components-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\map-bounds-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\scene-lighting-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\formation-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native composition, occupancy and effects on Windows x86
        run: |
          .\source\garrison-frame-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\radar-boundary-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\radar-shroud-mask-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\radar-shroud-assets-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\watch-shroud-mask-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\native-canvas-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\repair-visuals-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\source\projectile-visuals-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real styled controls, INI persistence and restart
        run: python source/tools/windows_settings_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: camera138final-windows-settings
          path: source/WINDOWS_SETTINGS_SMOKE.json

