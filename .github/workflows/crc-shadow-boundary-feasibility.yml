name: CRC single-boundary feasibility
on:
  push:
    branches: [work/latest-ra2-integration]
    paths:
      - 'source/research/crc_shadow_boundary_candidate.h'
      - 'source/research/crc_shadow_single_store_candidate.h'
      - 'source/assist/tests/crc_shadow_boundary_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_trampoline_probe.cpp'
      - 'source/assist/tests/crc_shadow_single_store_trampoline_contract.py'
      - 'source/assist/tests/crc_shadow_boundary_static.py'
      - 'source/assist/source/bridge.cpp'
      - 'source/assist/source/crc_shadow_bridge.h'
      - 'source/assist/source/crc_shadow_single_store_policy.h'
      - 'source/assist/source/guard.cpp'
      - 'source/assist/source/main.cpp'
      - 'source/assist/source/crc_shadow_policy.h'
      - 'source/research/evidence/crc-shadow-research.json'
      - 'source/research/evidence/crc-shadow-single-store-disassembly.json'
      - 'source/research/evidence/trainer-map-cheatcheck.json'
      - '.github/workflows/crc-shadow-boundary-feasibility.yml'
  pull_request:
    paths:
      - 'source/research/crc_shadow_boundary_candidate.h'
      - 'source/research/crc_shadow_single_store_candidate.h'
      - 'source/assist/tests/crc_shadow_boundary_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_feasibility.cpp'
      - 'source/assist/tests/crc_shadow_single_store_trampoline_probe.cpp'
      - 'source/assist/tests/crc_shadow_single_store_trampoline_contract.py'
      - 'source/assist/tests/crc_shadow_boundary_static.py'
      - 'source/assist/source/bridge.cpp'
      - 'source/assist/source/crc_shadow_bridge.h'
      - 'source/assist/source/crc_shadow_single_store_policy.h'
      - 'source/assist/source/guard.cpp'
      - 'source/assist/source/main.cpp'
      - 'source/assist/source/crc_shadow_policy.h'
      - 'source/research/evidence/crc-shadow-research.json'
      - 'source/research/evidence/crc-shadow-single-store-disassembly.json'
      - 'source/research/evidence/trainer-map-cheatcheck.json'
      - '.github/workflows/crc-shadow-boundary-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crc-shadow-boundary
  cancel-in-progress: true
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the synthetic transaction fixture
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror source/assist/tests/crc_shadow_boundary_feasibility.cpp -o /tmp/crc-shadow-boundary
          /tmp/crc-shadow-boundary
      - name: Compile and run the one-site store-suppression fixture
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror source/assist/tests/crc_shadow_single_store_feasibility.cpp -o /tmp/crc-shadow-single-store
          /tmp/crc-shadow-single-store
      - name: Compile and inspect the x86 one-site trampoline probe
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils
          python3 source/assist/tests/crc_shadow_single_store_trampoline_contract.py
      - name: Verify the native source and xref evidence
        run: python3 source/assist/tests/crc_shadow_boundary_static.py
