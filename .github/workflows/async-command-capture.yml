name: Async command world capture
on:
  pull_request:
    paths:
      - "source/shared/source/world_frame*.h"
      - "source/assist/source/world_frame_runtime.h"
      - "source/assist/source/bridge.cpp"
      - "source/assist/tests/async_command_policy.cpp"
      - "source/assist/tests/world_frame_command_worker_*"
      - ".github/workflows/async-command-capture.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: async-command-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strict ticket and snapshot ownership tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checks
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-error=misleading-indentation -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/async_command_policy.cpp -o checks/command-policy
          checks/command-policy | tee checks/command-policy.log
          g++ -std=c++17 -O2 -UNDEBUG -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/world_frame_command_index.cpp -o checks/command-index
          checks/command-index | tee checks/command-index.log
          python source/assist/tests/async_command_no_live_roster.py | tee checks/no-live-roster.log
          python source/assist/tests/world_frame_core_test.py | tee checks/world-frame.log
          python source/assist/tests/world_frame_retention.py --out checks/retention | tee checks/retention.log
          python source/assist/tests/tactical_frame_sampling.py --out checks/tactical | tee checks/tactical.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-command-portable-evidence
          path: checks/
  native:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paired compiler
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$((Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)"
          python -m pip install Pillow==11.3.0
      - name: Execute real pinned command capture worker DLL x86 and x64
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          python source/assist/tests/world_frame_command_worker_windows.py --zig "$ZIG" --out checks/command-windows
      - name: Paired Host x64 and Game Runtime x86 build, verify ABI
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/async-command-build"
          bash source/build-zig-x64.sh > checks/build.log 2>&1 || { tail -120 checks/build.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root async-command-build --host-arch x64 --webview2 | tee checks/pe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-command-windows-evidence
          path: |
            checks/
            async-command-build/*.exe
            async-command-build/*.dll
            async-command-build/*.json
