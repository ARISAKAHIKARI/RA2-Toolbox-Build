name: Async command world capture
on:
  pull_request:
    paths:
      - "source/shared/source/world_frame*.h"
      - "source/assist/source/world_frame_runtime.h"
      - "source/assist/source/bridge.cpp"
      - "source/assist/source/planner_types.h"
      - "source/assist/source/planner_provenance.h"
      - "source/assist/source/external_planner.h"
      - "source/assist/source/protocol.h"
      - "source/tools/verify_windows_outputs.py"
      - "source/assist/tests/planner_provenance.cpp"
      - "source/assist/source/execution_proof.h"
      - "source/assist/source/autoload_bridge.h"
      - "source/assist/source/unload_compute_bridge.h"
      - "source/assist/source/external_orders_bridge.h"
      - "source/assist/tests/execution_proof.cpp"
      - "source/assist/tests/unified_gateway_contract.py"
      - "source/assist/tests/ore_harvest_handoff.cpp"
      - "source/assist/tests/ore_harvest_handoff.py"
      - "source/assist/tests/async_command_no_live_roster.py"
      - "source/assist/tests/async_command_policy.cpp"
      - "source/assist/source/global_vehicle_scan_policy.h"
      - "source/assist/source/native_orders_bridge.h"
      - "source/assist/tests/global_vehicle_scan_policy.cpp"
      - "source/assist/source/repair_result_filter.h"
      - "source/assist/tests/repair_result_filter.cpp"
      - "source/assist/source/unload_retry_policy.h"
      - "source/assist/source/unload_admission.h"
      - "source/assist/tests/unload_retry_policy.cpp"
      - "source/assist/source/unload_policy.h"
      - "source/assist/tests/unload_groups.cpp"
      - "source/assist/tests/unload_index_incremental.cpp"
      - "source/assist/tests/unload_loaded_admission.py"
      - "source/assist/tests/unload_loaded_admission.cpp"
      - "source/assist/tests/world_frame_command_worker_*"
      - ".github/workflows/async-command-capture.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: async-command-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strict ticket and snapshot ownership tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checks
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror source/assist/tests/plan_freshness.cpp -o checks/plan-freshness
          checks/plan-freshness | tee checks/plan-freshness.log
          python source/assist/tests/automation_no_deadline_contract.py | tee checks/automation-no-deadline.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-error=misleading-indentation -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/async_command_policy.cpp -o checks/command-policy
          checks/command-policy | tee checks/command-policy.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/execution_proof.cpp -o checks/execution-proof
          checks/execution-proof | tee checks/execution-proof.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/planner_provenance.cpp -o checks/planner-provenance
          checks/planner-provenance | tee checks/planner-provenance.log
          python source/assist/tests/unified_gateway_contract.py | tee checks/gateway-contract.log
          python source/assist/tests/ore_harvest_handoff.py --out checks/ore-proof | tee checks/ore-proof.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror source/assist/tests/global_vehicle_scan_policy.cpp -o checks/global-vehicle-scan
          checks/global-vehicle-scan | tee checks/global-vehicle-scan.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/repair_result_filter.cpp -o checks/repair-result-filter
          checks/repair-result-filter | tee checks/repair-result-filter.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-error=misleading-indentation -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/unload_retry_policy.cpp -o checks/unload-retry
          checks/unload-retry | tee checks/unload-retry.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-error=misleading-indentation -Wno-error=parentheses -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/unload_groups.cpp -o checks/unload-groups
          checks/unload-groups | tee checks/unload-groups.log
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-error=misleading-indentation -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/unload_index_incremental.cpp -o checks/unload-index
          checks/unload-index | tee checks/unload-index.log
          python source/assist/tests/unload_loaded_admission.py --current-only --out checks/unload-admission | tee checks/unload-admission.log
          g++ -std=c++17 -O2 -UNDEBUG -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/world_frame_command_index.cpp -o checks/command-index
          checks/command-index | tee checks/command-index.log
          python source/assist/tests/async_command_no_live_roster.py | tee checks/no-live-roster.log
          python source/assist/tests/world_frame_core_test.py | tee checks/world-frame.log
          python source/assist/tests/world_frame_retention.py --out checks/retention | tee checks/retention.log
          python source/assist/tests/tactical_frame_sampling.py --out checks/tactical | tee checks/tactical.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-command-portable-evidence
          path: checks/
  native:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paired compiler
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$((Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)"
          python -m pip install Pillow==11.3.0
      - name: Execute real pinned command capture worker DLL x86 and x64
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          python source/assist/tests/world_frame_command_worker_windows.py --zig "$ZIG" --out checks/command-windows
      - name: Paired Host x64 and Game Runtime x86 build, verify ABI
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/async-command-build"
          bash source/build-zig-x64.sh > checks/build.log 2>&1 || { tail -120 checks/build.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root async-command-build --host-arch x64 --webview2 | tee checks/pe.log
      - name: Package paired Update from this exact Windows build
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/package_automation_no_deadlines.py --root async-command-build --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-PR71-NoFixedDeadline-x64-Update
          retention-days: 30
          if-no-files-found: error
          path: async-command-build/RA2Toolbox-PR71-NoFixedDeadline-x64-Update.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: async-command-windows-evidence
          path: |
            checks/
            async-command-build/*.exe
            async-command-build/*.dll
            async-command-build/*.json
