name: Verify game-thread cost and Host off-thread display capture
on:
  push:
    branches: [fix/game-thread-probe-budget-20261117, fix/display-capture-offthread-admission-20261117]
    paths:
      - 'source/**'
      - '.github/workflows/verify-game-thread-probe-budget.yml'
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/verify-game-thread-probe-budget.yml'
permissions:
  contents: read
concurrency:
  group: offthread-display-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-path-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prove passive display flags and page requests never force a command graph
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/display_capture_offthread.cpp -o /tmp/display-capture-offthread
          /tmp/display-capture-offthread
      - name: Regress irrelevant message fast path and original 17 input messages
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -UNDEBUG source/assist/tests/runtime_message_hotpath.cpp -o /tmp/ra2-message-hotpath
          /tmp/ra2-message-hotpath
      - name: Validate native PiP Surface failure release and guarded restoration
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/native_pip_core.cpp -o /tmp/ra2-native-pip-core
          /tmp/ra2-native-pip-core
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/native_pip_bridge.cpp -o /tmp/ra2-native-pip-bridge
          /tmp/ra2-native-pip-bridge
      - name: Exercise production tooltip idle/enable/restore source
        shell: bash
        run: |
          set -euo pipefail
          python3 source/assist/tests/build_time_tick_idle.py
      - name: Run full exact-page failure and asynchronous recovery fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 source/assist/tests/world_frame_core_test.py
          python3 source/assist/tests/tactical_frame_sampling.py --out /tmp/game-budget-sampling
          python3 source/assist/tests/unload_loaded_admission.py --out /tmp/game-budget-unload --current-only
      - name: Check native hook ownership and MIX compatibility remain intact
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/debug_patch_policy.cpp -o /tmp/critical-owner
          /tmp/critical-owner
          for name in unit_monitor_mix_archive unit_info_panel_mix_cameos; do
            g++ -std=c++17 -O2 -Wno-error=misleading-indentation -UNDEBUG "source/assist/tests/$name.cpp" -o "/tmp/$name"
            "/tmp/$name"
          done

  windows-paired-compile:
    needs: critical-path-regression
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.13 and icon packaging dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if ((& $zig version) -ne '0.13.0') {throw 'Incorrect Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force diagnostics,dist/compiled | Out-Null
      - name: Compile x86 GameRuntime and x64 Host with isolated visual subscriptions
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/dist/compiled"
          bash source/build-zig-x64.sh > diagnostics/windows-build.log 2>&1 || { tail -130 diagnostics/windows-build.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root dist/compiled --host-arch x64 --webview2
          python source/assist/tests/world_frame_async_windows.py --zig "$ZIG" --out diagnostics/async-recovery
          python source/assist/tests/native_pip_windows.py --zig "$ZIG" --out diagnostics/native-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA2Toolbox-offthread-display-windows-diagnostics
          path: diagnostics/
          retention-days: 14
