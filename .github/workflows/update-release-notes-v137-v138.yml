name: Simplify 1.0.37 and 1.0.38 release notes
on:
  push:
    branches: [codex/release-notes-v137-v138-20261026]
    paths: ['.github/workflows/update-release-notes-v137-v138.yml']
permissions:
  contents: read
concurrency:
  group: update-release-notes-v137-v138
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update only the two published release descriptions and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "ARISAKAHIKARI/RA2-Toolbox-Build"
          updates = json.loads(r'''[{"tag":"v1.0.37","id":422900730,"expected_hash":"b60a6156ad00ae5b3b605d81421c72f80bc8a78821573035e6e6620ed1eb047e","body":"相对 1.0.36 的更新。\n\n## 新增与增强\n\n- 新增六种地面队形，支持真实单位预览、拖拽调整和后续移动保持队形。\n- 新增最多三个局部观察窗，支持单位跟踪、组内接替和点击定位。\n- 增强防空火控，支持提前分配与预留火力，以及导弹／全部空军、智能／平均分配选项。\n- 新增地图全开、随处建造和科技解锁的直接模式，以及实验性科技加强。\n- 增强磁电全局无限吸和自动摔落，扩展落点判断与独立计算选项。\n- 扩展单击／双击快捷键和自定义鼠标操作，新增实验性 Sticky 驻守入口。\n\n## 修复与优化\n\n- 修复部分功能开关和快捷键设置保存、重启恢复异常。\n- 修复队形拖拽与续走、坦克碉堡进驻、磁电操作及部分攻击指令问题。\n- 修复生产提醒、预定显示、空闲飞机轮选和切回游戏后的覆盖层恢复。\n- 修复敌方标记跟随、载员气泡移动及部分状态图标的位置、大小问题。\n- 改善观察窗的遮挡、刷新和素材显示，修复建造与单位统计图标读取。\n"},{"tag":"v1.0.38","id":423549275,"expected_hash":"bbbccc9fd0be14bfc23b13ef28cb4ce3d5de84c3947e0f3fdb58161166709ce8","body":"相对 1.0.37 的更新。\n\n## 新增与增强\n\n- 小地图新增实景模式，支持示意／实景切换；实景缩放范围为 5%～200%，默认 10%。\n- 新增小地图、单位统计和跟踪窗口的独立副屏显示，支持拖动、保存位置及小地图窗口尺寸调整。\n- 跟踪窗口支持步兵进入载具或建筑后继续跟随，离开后重新跟随原步兵。\n- 扩展生产预定：步兵与载具（含飞机、舰船）队列各最多 30 项，支持满足条件后自动加入游戏队列。\n- 信息刷新率新增跟随游戏所在显示器刷新率的自适应选项。\n- 敌方标记支持邻近单位聚合；实景地图与观察窗补充建筑动画、驻军外观、维修扳手及可见抛射体显示。\n\n## 修复与优化\n\n- 修复小地图及观察窗的黑幕错位、地图边缘黑边、地形遮挡和部分缩放显示问题。\n- 修复部分单位、建筑、矿石与地形的亮度、色盘、图标及动画显示问题。\n- 修复跟踪窗口闪烁、误关闭、停止更新及旧画面回流问题。\n- 修复切回游戏后覆盖层被遮挡，以及窗口层级、刷新不一致的问题。\n- 修复静止切换队形时预览与目标位置未更新的问题。\n- 优化素材缓存、异步绘制和读取效率，减少重复加载与绘制；调整生产预定、自动躲弹的面板分类。\n"}]''')
          def api(path, method="GET", data=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=None if data is None else json.dumps(data, ensure_ascii=False).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
                  method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def metadata(release):
              return {key: release[key] for key in
                      ("id", "tag_name", "name", "target_commitish", "draft", "prerelease", "assets")}
          before = {}
          for item in updates:
              release = api("/releases/tags/" + item["tag"])
              assert release["id"] == item["id"]
              assert not release["draft"] and not release["prerelease"]
              digest = hashlib.sha256(release["body"].encode()).hexdigest()
              assert digest == item["expected_hash"] or release["body"] == item["body"], "Release notes changed since review"
              before[item["tag"]] = release
          for item in updates:
              if before[item["tag"]]["body"] != item["body"]:
                  api("/releases/" + str(item["id"]), "PATCH", {"body": item["body"]})
              actual = api("/releases/" + str(item["id"]))
              assert actual["body"] == item["body"], "Release body mismatch"
              assert metadata(actual) == metadata(before[item["tag"]]), "Release metadata changed"
              print("Verified release description: " + item["tag"])
          
