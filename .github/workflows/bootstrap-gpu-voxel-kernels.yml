name: Bootstrap GPU voxel kernels
on:
  push:
    branches: [codex/vulkan-voxel-kernel-bootstrap-20261029]
permissions:
  contents: read
jobs:
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official compiler and validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
      - name: Compile all three Vulkan 1.0 passes
        run: python3 source/tools/build_gpu_voxel_kernels.py --output generated/gpu_voxel_spirv.h | tee gpu-voxel-shaders.json
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-voxel-kernels
          if-no-files-found: error
          path: |
            generated/gpu_voxel_spirv.h
            gpu-voxel-shaders.json
