name: Publish RA2 Toolbox 1.0.39-pre.6
on:
  push:
    branches: [codex/release-v139-pre6]
    paths: ['.github/workflows/publish-v139-pre6.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v139-pre6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: b372ace50101e0099a5e9533c50470b4cabb1536
      BUILD_RUN: '40687783887'
    steps:
      - uses: actions/checkout@v4
      - name: Require successful validation of the exact product sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/build-run.json"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/build-jobs.json"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          run=json.loads((temp/'build-run.json').read_text())
          assert run['head_sha']==os.environ['BUILD_SHA']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/validate-render-upgrade.yml'
          assert run['repository']['full_name']==os.environ['GH_REPO']
          jobs=json.loads((temp/'build-jobs.json').read_text())['jobs']
          assert {j['name'] for j in jobs}=={'integrate','windows-x86'}
          assert all(j['head_sha']==os.environ['BUILD_SHA'] and j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          artifacts=json.loads((temp/'build-artifacts.json').read_text())['artifacts']
          for name in ('RA2-Toolbox-render-upgrade-experiment','RA2-render-upgrade-diagnostics'):
              matches=[a for a in artifacts if a['name']==name]
              assert len(matches)==1 and not matches[0]['expired'],name
              assert matches[0]['workflow_run']['head_sha']==os.environ['BUILD_SHA']
          PY
          git fetch --depth=1 origin "$BUILD_SHA"
          git diff --exit-code "$BUILD_SHA" HEAD -- source README.md AGENTS.md docs LICENSE-GPL THIRD_PARTY_NOTICES.md .gitattributes .github/workflows/validate-render-upgrade.yml
      - name: Download, verify and package the tested Windows binaries
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name RA2-Toolbox-render-upgrade-experiment --dir "$RUNNER_TEMP/v139-pre6-binaries"
          gh run download "$BUILD_RUN" --name RA2-render-upgrade-diagnostics --dir "$RUNNER_TEMP/v139-pre6-diagnostics"
          cp "$RUNNER_TEMP/v139-pre6-binaries/RA2Toolbox.exe" "$RUNNER_TEMP/v139-pre6-binaries/GameRuntime.dll" source/
          python3 source/tools/verify_windows_outputs.py
          python3 packages/v1.0.39-pre.6/package_release.py --binaries "$RUNNER_TEMP/v139-pre6-binaries" --diagnostics "$RUNNER_TEMP/v139-pre6-diagnostics" --out dist/v1.0.39-pre.6
          python3 - <<'PY'
          import os,pathlib
          body=pathlib.Path('packages/v1.0.39-pre.6/RELEASE_NOTES.md').read_text()
          body+='\n\n验证构建：['+os.environ['BUILD_SHA'][:12]+'](https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['BUILD_RUN']+')。\n'
          pathlib.Path(os.environ['RUNNER_TEMP'],'release-notes.md').write_text(body)
          PY
      - name: Upload and verify the draft, then publish the prerelease
        run: |
          set -euo pipefail
          tag=v1.0.39-pre.6
          title='RA2 Toolbox 1.0.39-pre.6 — xBRZ 高分与飞机火力分配'
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,pathlib
          assert json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'release-state.json').read_text())['isDraft'],'Refusing to replace an already-published release'
          PY
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json" 2>/dev/null; then
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          fi
          gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$tag" dist/v1.0.39-pre.6/RA2-Toolbox-v1.0.39-pre.6-Update.zip dist/v1.0.39-pre.6/RA2-Toolbox-v1.0.39-pre.6-Source.zip dist/v1.0.39-pre.6/release-manifest.json dist/v1.0.39-pre.6/SHA256SUMS.txt --clobber
          mkdir remote-check
          gh release download "$tag" --pattern '*.zip' --pattern release-manifest.json --pattern SHA256SUMS.txt --dir remote-check
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          local=pathlib.Path('dist/v1.0.39-pre.6');remote=pathlib.Path('remote-check')
          manifest=json.loads((local/'release-manifest.json').read_text())
          for asset in manifest['assets']:
              data=(remote/asset['name']).read_bytes()
              assert len(data)==asset['bytes'] and hashlib.sha256(data).hexdigest()==asset['sha256']
          for name in ('release-manifest.json','SHA256SUMS.txt'):
              assert (remote/name).read_bytes()==(local/name).read_bytes()
          for line in (remote/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((remote/name).read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(remote/'RA2-Toolbox-v1.0.39-pre.6-Update.zip') as archive:
              assert archive.testzip() is None
              assert {'RA2Toolbox.exe','GameRuntime.dll','README.txt','LICENSE-GPL.txt','xBRZ-LICENSE.txt','THIRD_PARTY_NOTICES.md','verification.json'}==set(archive.namelist())
              for name,record in manifest['binaries'].items():
                  assert hashlib.sha256(archive.read(name)).hexdigest()==record['sha256']
          PY
          gh release view "$tag" --json tagName,isDraft,assets > "$RUNNER_TEMP/release-candidate.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'release-candidate.json').read_text())
          assert r['tagName']=='v1.0.39-pre.6' and r['isDraft']
          assert {a['name'] for a in r['assets']}=={'RA2-Toolbox-v1.0.39-pre.6-Update.zip','RA2-Toolbox-v1.0.39-pre.6-Source.zip','release-manifest.json','SHA256SUMS.txt'}
          PY
          gh release edit "$tag" --draft=false --prerelease=true --latest=false
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          gh release view "$tag" --json url,tagName,isDraft,isPrerelease,assets > published-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('published-release.json'))
          assert r['tagName']=='v1.0.39-pre.6' and not r['isDraft'] and r['isPrerelease']
          assert {a['name'] for a in r['assets']}=={'RA2-Toolbox-v1.0.39-pre.6-Update.zip','RA2-Toolbox-v1.0.39-pre.6-Source.zip','release-manifest.json','SHA256SUMS.txt'}
          PY
          cat published-release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2-v139-pre6-publish-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            published-release.json
            dist/v1.0.39-pre.6/release-manifest.json
            dist/v1.0.39-pre.6/SHA256SUMS.txt
