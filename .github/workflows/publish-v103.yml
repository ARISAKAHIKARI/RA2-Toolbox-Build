name: Publish RA2 Toolbox v1.0.3 binary update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v103.yml'
      - 'packages/v1.0.3/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v103
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify binary-only update
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,zipfile
          p=pathlib.Path('packages/v1.0.3/RA2-Toolbox-v1.0.3-Update.zip')
          m=json.loads(p.with_name('manifest.json').read_text())
          assert p.stat().st_size==m['bytes']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'RA2Toolbox.exe','GameRuntime.dll','README-1.0.3.txt'}
              for n,h in m['files'].items():
                  assert hashlib.sha256(z.read(n)).hexdigest()==h
          print('PASS: binary update content and SHA256')
          PY
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.0.3'
          asset='RA2-Toolbox-v1.0.3-Update.zip'
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            draft=$(python3 -c 'import json; print(str(json.load(open("release-state.json"))["isDraft"]).lower())')
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'RA2 Toolbox v1.0.3 Update (requires 1.0.2)' --notes-file packages/v1.0.3/RELEASE_NOTES.md
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release upload "$tag" "packages/v1.0.3/$asset" --clobber
          fi
          mkdir -p remote-check
          gh release download "$tag" --pattern "$asset" --dir remote-check
          python3 - <<'PY'
          import pathlib,json,hashlib
          m=json.load(open('packages/v1.0.3/manifest.json'))
          p=pathlib.Path('remote-check/RA2-Toolbox-v1.0.3-Update.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          PY
          if [ "$draft" = true ]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi
          gh release view "$tag" --json url,tagName,isDraft,isPrerelease,assets >> "$GITHUB_STEP_SUMMARY"
