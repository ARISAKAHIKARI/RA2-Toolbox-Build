name: Validate and publish 1.0.41-pre.2
on:
  push:
    branches: [codex/map-hardware-pre2-20261104]
    paths: [source/**, packages/v1.0.41-pre.2/**, .github/workflows/publish-v141-pre2.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v141-pre2
  cancel-in-progress: true
jobs:
  console-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the console state model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/console-browser
          node source/suite/tests/console_store_test.mjs 2>&1 | tee diagnostics/console-browser/model.log
          python3 source/assist/tests/control_parameters.py --out diagnostics/console-browser/control-policy
          python3 source/assist/tests/superweapon_grant_settings.py --out diagnostics/console-browser/superweapon-settings
          python3 source/assist/tests/map_visibility_settings.py --out diagnostics/console-browser/map-settings
          python3 source/assist/tests/construction_host_test.py
          python3 source/assist/tests/construction_batch_runtime_test.py
          for name in fixed_capacity formation_quick missile_compute cooperative; do
            g++ -std=c++17 -O1 -UNDEBUG -fsanitize=address,undefined "source/assist/tests/$name.cpp" -o "diagnostics/console-browser/$name"
            ASAN_OPTIONS=detect_leaks=0 "diagnostics/console-browser/$name"
          done
          g++ -std=c++17 -O1 -UNDEBUG source/assist/tests/resolution_sampling.cpp source/third_party/xbrz/xbrz.cpp -o diagnostics/console-browser/resolution_sampling
          diagnostics/console-browser/resolution_sampling
          for name in host_control_modes control_master_bridge control_house_flags; do
            g++ -std=c++17 -O2 -UNDEBUG "source/assist/tests/$name.cpp" -o "diagnostics/console-browser/$name"
            "diagnostics/console-browser/$name"
          done
      - name: Install the pinned browser fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise actual Chromium controls and capture the desktop layout
        shell: bash
        run: |
          set -euo pipefail
          export CONSOLE_SCREENSHOT="$PWD/diagnostics/console-browser/console-desktop.png"
          node source/suite/tests/console_store_test.mjs --browser 2>&1 | tee diagnostics/console-browser/browser.log
      - name: Preserve the controlled UI screenshot and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-Console-MVVM-browser
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics/console-browser/
  console-win32-fixtures:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: source
      - name: Install Zig 0.13.0 for the isolated Win32 fixtures
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force diagnostics/console-win32,fixtures | Out-Null
      - name: Verify the one-slot map flag callback on real Windows
        shell: pwsh
        run: |
          python source/assist/tests/map_visibility_windows.py --zig $env:ZIG_EXE --out diagnostics/console-win32/map-hardware
          if($LASTEXITCODE -ne 0){throw 'Map hardware fixture failed'}
      - name: Activate Common Controls 6 for the independent fixture process
        shell: pwsh
        run: |
          $manifest='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity type="win32" name="RA2.Console.Fixture" version="1.0.0.0" processorArchitecture="amd64"/><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="amd64" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="asInvoker" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>'
          Set-Content -Encoding utf8NoBOM fixtures/fixture.manifest $manifest
          Set-Content -Encoding ascii fixtures/fixture.rc '1 24 "fixture.manifest"'
          Push-Location fixtures
          & $env:ZIG_EXE rc /fo fixture.res fixture.rc
          $status=$LASTEXITCODE
          Pop-Location
          if($status -ne 0){throw 'Fixture activation manifest compilation failed'}
      - name: Execute native control dispatch and asynchronous INI file fixtures
        shell: pwsh
        run: |
          $flags=@('-target','x86_64-windows-gnu','-std=c++17','-O2','-UNDEBUG')
          & $env:ZIG_EXE c++ @flags source/suite/tests/console_adapter_windows.cpp fixtures/fixture.res -o fixtures/console_adapter_windows.exe -lkernel32 -luser32 -lgdi32 -lcomctl32 2>&1 | Tee-Object diagnostics/console-win32/adapter-build.log
          if($LASTEXITCODE -ne 0){throw 'Console adapter fixture compilation failed'}
          & ./fixtures/console_adapter_windows.exe 2>&1 | Tee-Object diagnostics/console-win32/adapter.log
          if($LASTEXITCODE -ne 0){throw 'Console adapter real Win32 fixture failed'}
          & $env:ZIG_EXE c++ @flags source/suite/tests/async_ini_store_test.cpp -o fixtures/async_ini_store_test.exe -lkernel32 2>&1 | Tee-Object diagnostics/console-win32/ini-build.log
          if($LASTEXITCODE -ne 0){throw 'INI store fixture compilation failed'}
          & ./fixtures/async_ini_store_test.exe 2>&1 | Tee-Object diagnostics/console-win32/ini.log
          if($LASTEXITCODE -ne 0){throw 'INI store real Win32 file fixture failed'}
      - name: Verify shared hardware control and technology slots on real Windows
        shell: pwsh
        run: |
          python source/assist/tests/control_parameters_windows.py --zig $env:ZIG_EXE --build-dir diagnostics/console-win32/control-hardware --output diagnostics/console-win32/control-hardware/result.json
          if($LASTEXITCODE -ne 0){throw 'Hardware control fixture failed'}
          python source/assist/tests/tech_enhancement_parameter_windows.py --zig $env:ZIG_EXE --build-dir diagnostics/console-win32/technology-four --output diagnostics/console-win32/technology-four/result.json
          if($LASTEXITCODE -ne 0){throw 'Technology slot regression failed'}
          python source/assist/tests/tech_ui_publish_windows.py --zig $env:ZIG_EXE --out diagnostics/console-win32/retirement
          if($LASTEXITCODE -ne 0){throw 'Hardware retirement diagnostics regression failed'}
          python source/assist/tests/tech_enhancement_parameter_settings.py --zig $env:ZIG_EXE --build-dir diagnostics/console-win32/level-switch --output diagnostics/console-win32/level-switch/result.json
          if($LASTEXITCODE -ne 0){throw 'Independent level comparison setting failed'}
          python source/tools/verify_crossbit_abi.py --zig $env:ZIG_EXE --output diagnostics/console-win32/abi.json
          if($LASTEXITCODE -ne 0){throw 'Protocol 96 ABI mismatch'}
      - name: Verify native placement click admission and local UI completion
        shell: pwsh
        run: |
          python source/tools/test_native_placement.py --zig $env:ZIG_EXE --build-dir diagnostics/console-win32/placement-entry
          if($LASTEXITCODE -ne 0){throw 'Native placement input/queue regression failed'}
          python source/assist/tests/native_placement_completion.py --zig $env:ZIG_EXE --out diagnostics/console-win32/placement-completion
          if($LASTEXITCODE -ne 0){throw 'Native placement local UI completion failed'}
      - name: Preserve isolated Win32 fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-Console-MVVM-win32-fixtures
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics/console-win32/
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force artifacts/console,diagnostics | Out-Null
      - name: Compile the modern x64 host and paired x86 Runtime and broker
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/artifacts/console"
          bash source/build-zig-x64.sh > diagnostics/console-build.log 2>&1 || { tail -100 diagnostics/console-build.log; exit 1; }
          tail -50 diagnostics/console-build.log
          python source/tools/verify_windows_outputs.py --root artifacts/console --host-arch x64 --webview2
      - name: Record the paired build identity
        shell: pwsh
        run: |
          $files=@()
          foreach($name in 'RA2Toolbox.exe','GameRuntime.dll','GameRuntimeHost32.exe','WebView2Loader.dll'){
            $path="artifacts/console/$name"
            $files+=@{name=$name;bytes=(Get-Item $path).Length;sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{commit=$env:GITHUB_SHA;branch=$env:GITHUB_REF_NAME;host='x64';runtime='x86';broker='x86';console='WebView2 MVVM';webview2_sdk='1.0.4314.35';compile_only=$true;game_tested=$false;files=$files} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/console/CONSOLE_COMPILE.json
      - name: Upload the modern console binaries and required loader notices
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-Console-MVVM-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/console/RA2Toolbox.exe
            artifacts/console/GameRuntime.dll
            artifacts/console/GameRuntimeHost32.exe
            artifacts/console/WebView2Loader.dll
            artifacts/console/licenses/WebView2/LICENSE.txt
            artifacts/console/licenses/WebView2/NOTICE.txt
            artifacts/console/BUILD_SOURCE_MANIFEST.json
            artifacts/console/BUILD_TARGET.json
            artifacts/console/WINDOWS_BUILD_ARTIFACTS.json
            artifacts/console/CONSOLE_COMPILE.json
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-Console-MVVM-build-log
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics/console-build.log
  publish:
    needs: [console-browser, console-win32-fixtures, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            packages/v1.0.41-pre.2
            payload/v0.6.2-buildfix4-full
            release/v0.6.2-buildfix4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RA2Toolbox-Console-MVVM-x64
          path: paired-binaries
      - name: Assemble and verify Full and Update packages
        shell: bash
        run: |
          set -euo pipefail
          python packages/v1.0.41-pre.2/package_release.py --binaries paired-binaries --out dist --commit "$GITHUB_SHA"
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Create a draft and verify every uploaded asset before publication
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.0.41-pre.2
          gh api "repos/$GH_REPO/releases?per_page=100" > release-list.json
          python - <<'PYCODE'
          import json
          matches=[r for r in json.load(open('release-list.json')) if r['tag_name']=='v1.0.41-pre.2']
          assert len(matches)<=1
          json.dump(matches[0] if matches else {},open('release-before.json','w'))
          PYCODE
          if python -c "import json,sys;sys.exit(0 if json.load(open('release-before.json')) else 1)"; then
            python - <<'PYCODE'
          import json,os
          r=json.load(open('release-before.json'))
          assert r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['GITHUB_SHA'], 'Existing release is public or belongs to another commit'
          PYCODE
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'RA2 Toolbox 1.0.41-pre.2' --notes-file packages/v1.0.41-pre.2/RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/RA2Toolbox-1.0.41-pre.2-x64-Full.zip dist/RA2Toolbox-1.0.41-pre.2-x64-Update.zip dist/release-manifest.json dist/SHA256SUMS.txt --clobber
          gh release download "$tag" --dir downloaded
          cd downloaded
          sha256sum -c SHA256SUMS.txt
          cd ..
          gh api "repos/$GH_REPO/releases?per_page=100" > release-list.json
          python - <<'PYCODE'
          import json
          matches=[r for r in json.load(open('release-list.json')) if r['tag_name']=='v1.0.41-pre.2']
          assert len(matches)==1
          json.dump(matches[0],open('release-draft.json','w'))
          PYCODE
          python - <<'PYCODE'
          import json,os
          r=json.load(open('release-draft.json'))
          expected={'RA2Toolbox-1.0.41-pre.2-x64-Full.zip','RA2Toolbox-1.0.41-pre.2-x64-Update.zip','release-manifest.json','SHA256SUMS.txt'}
          assert r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['GITHUB_SHA']
          assert {a['name'] for a in r['assets']}==expected and all(a['size']>0 for a in r['assets'])
          PYCODE
          python - <<'PYCODE'
          import json,os,subprocess
          release=json.load(open('release-draft.json'));assert isinstance(release['id'],int)
          json.dump({'draft':False,'prerelease':True,'make_latest':'false'},open('publish-request.json','w'))
          with open('published-release.json','w') as out:
              subprocess.run(['gh','api','--method','PATCH','repos/'+os.environ['GH_REPO']+'/releases/'+str(release['id']),'--input','publish-request.json'],stdout=out,check=True)
          PYCODE
          python - <<'PYCODE'
          import json,os
          r=json.load(open('published-release.json'))
          assert not r['draft'] and r['prerelease'] and r['target_commitish']==os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('Published '+r['html_url']+'\n')
          PYCODE
      - name: Preserve release identity and package digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.41-pre.2-publication
          retention-days: 30
          if-no-files-found: warn
          path: |
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            published-release.json
            release-draft.json
