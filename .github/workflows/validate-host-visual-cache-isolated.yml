name: Isolated Host visual cache regression
on:
  push:
    branches: [fix/host-visual-covered-lease-20261126]
permissions:
  contents: read
concurrency:
  group: host-visual-cache-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise production snapshot and Host display cache headers
        run: python3 source/assist/tests/world_frame_core_test.py
      - name: Verify bounded publication handoff and duplicate submission
        run: |
          g++ -std=c++17 -O2 -UNDEBUG -pthread -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/world_frame_publication.cpp -o /tmp/publication-pool
          /tmp/publication-pool
      - name: Exercise production catalogue and display sampling recovery
        run: python3 source/assist/tests/catalogue_frame_sampling.py --out /tmp/catalogue-regression
      - name: Check read-only display wiring
        run: python3 source/assist/tests/display_capture_runtime_wiring.py
