name: Build and publish 1.0.53.2 offline toolbar preview
on:
  push:
    branches: [feature/offline-wrench-repair-rules]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-toolbar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native tool policies and existing cursor / runtime demand regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checks
          for name in offline_tool_policy command_cursor_host runtime_feature_demand; do
            g++ -std=c++17 -O2 -UNDEBUG -pthread "source/assist/tests/$name.cpp" -o "checks/$name"
            "checks/$name" | tee "checks/$name.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-toolbar-portable
          path: checks/
  native:
    needs: portable
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native compiler
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$((Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)"
          python -m pip install Pillow==11.3.0
      - name: Build paired Host and Runtime and verify protocol
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/offline-toolbar-build"
          mkdir -p checks
          bash source/build-zig-x64.sh > checks/build.log 2>&1 || { tail -120 checks/build.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root offline-toolbar-build --host-arch x64 --webview2 | tee checks/pe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-toolbar-native-checks
          path: checks/
      - uses: actions/upload-artifact@v4
        with:
          name: v1532-matched-build
          path: offline-toolbar-build/
          if-no-files-found: error
  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1532-matched-build
          path: dist/compiled
      - name: Assemble verified matched Update
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RA2_RELEASE_VERSION_W L"1.0.53.2"' source/shared/source/release_version.h
          python3 source/tools/verify_windows_outputs.py --root dist/compiled --host-arch x64 --webview2
          mkdir -p dist/update
          for f in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll BUILD_TARGET.json BUILD_SOURCE_MANIFEST.json WINDOWS_BUILD_ARTIFACTS.json; do
            test -s "dist/compiled/$f"
            cp "dist/compiled/$f" dist/update/
          done
          if test -f dist/compiled/CONSOLE_COMPILE.json; then cp dist/compiled/CONSOLE_COMPILE.json dist/update/; fi
          if test -d dist/compiled/licenses; then cp -a dist/compiled/licenses dist/update/; fi
          cp packages/v1.0.53.2/RELEASE_NOTES.md dist/update/
          printf '%s\n' "$GITHUB_SHA" > dist/update/BUILD_COMMIT.txt
          (cd dist/update && zip -q -r ../RA2Toolbox-1.0.53.2-x64-Update.zip .)
          unzip -tq dist/RA2Toolbox-1.0.53.2-x64-Update.zip
          (cd dist && sha256sum RA2Toolbox-1.0.53.2-x64-Update.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.53.2-update
          path: |
            dist/RA2Toolbox-1.0.53.2-x64-Update.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish preview without replacing Latest
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.53.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing release'
            exit 1
          fi
          gh release create v1.0.53.2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'RA2 Toolbox 1.0.53.2 · 测试版' --notes-file packages/v1.0.53.2/RELEASE_NOTES.md dist/RA2Toolbox-1.0.53.2-x64-Update.zip dist/SHA256SUMS.txt
          gh release view v1.0.53.2 --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
