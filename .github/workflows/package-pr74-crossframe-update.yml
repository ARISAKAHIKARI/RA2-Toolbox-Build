name: Package 1.0.52-pre.23 PR77 Update (paired x64 Host / x86 Runtime)
on:
  pull_request:
    paths:
      - '.github/workflows/package-pr74-crossframe-update.yml'
      - 'source/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-pr77-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  paired-windows-update:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      UPDATE_FILENAME: RA2Toolbox-1.0.52-pre.23-x64-Update.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned cross compiler
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$((Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)"
          python -m pip install Pillow==11.3.0
      - name: Verify restored native selection and UI entries
        shell: bash
        run: |
          set -euo pipefail
          python source/assist/tests/async_command_no_live_roster.py
          python source/assist/tests/ui_recovery_contract.py
          python source/assist/tests/variant_selection_entry_test.py
          python source/assist/tests/high_fps_gesture_contract.py
          python source/assist/tests/unit_info_panel_host_contract.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -UNDEBUG source/assist/tests/unit_info_panel_layout.cpp -o /tmp/unitpanel-layout
          /tmp/unitpanel-layout
      - name: Compile x64 Host and matched x86 Runtime and Broker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checks
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/update-candidate"
          bash source/build-zig-x64.sh > checks/compile.log 2>&1 || { tail -120 checks/compile.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root update-candidate --host-arch x64 --webview2 | tee checks/pe.log
      - name: Package and verify candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/package_automation_no_deadlines.py --root update-candidate --sha "$GITHUB_SHA" \
            --output-name "$UPDATE_FILENAME" \
            --label "1.0.52-pre.23 PR77 synchronous Runtime commands, one-press camera, weapon selection and compact UI" | tee checks/package.log
      - uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.52-pre.23-x64-Update
          retention-days: 30
          if-no-files-found: error
          path: update-candidate/${{ env.UPDATE_FILENAME }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre23-Update-Compile-Evidence
          path: checks/
