"],[672957882,\"RA2-Toolbox-v1.0.37-Update.zip\",1475321,\"sha256:46ea4590371d894c9b77281c41f2225dfb5f71b1ca7c2e9328a542dd1ebdcdf9\"],[672957885,\"release-manifest.json\",1911,\"sha256:cd3e12125073a9d77ced76af8bcf4cff712f3cd3df35993daec8bf0a1aad8585\"]]},{\"id\":421412586,\"tag\":\"v1.0.36\",\"assets\":[[667811478,\"RA2-Toolbox-v1.0.36-Source.zip\",1480314,\"sha256:a3560fe1b6f6e80b6464949b13845fd0c7c07fa0964df3f9a539df389501054c\"],[667811479,\"RA2-Toolbox-v1.0.36-Update.zip\",1198938,\"sha256:3147a154b9c22a53e0cd23e989e103903747eabc6c86387f921d4ac4a8b45891\"],[667811477,\"RA2-Toolbox-v1.0.36-Windows.zip\",144458777,\"sha256:cff1a8c4df80356dc1690399b8387aa7ec70df83a9f980dc64197343ae1918d4\"]]},{\"id\":420903639,\"tag\":\"v1.0.35\",\"assets\":[[666298920,\"RA2-Toolbox-v1.0.35-Source.zip\",1430876,\"sha256:9bc163e4b425587f57306b73800295e1af06a38bdc70fe893f95437a5ca92134\"],[666298919,\"RA2-Toolbox-v1.0.35-Update.zip\",1180935,\"sha256:ce4c2adf9d51434b74fd37de03454b3c0eab3f925cf8a9ef25324453830f3905\"],[666371271,\"RA2-Toolbox-v1.0.35-Windows.zip\",144440961,\"sha256:980672a46b1d4b29540c45ad4196f97ab2568e25360c627c620eca506b152de0\"]]},{\"id\":418244879,\"tag\":\"v1.0.26\",\"assets\":[[658923719,\"RA2-Toolbox-v1.0.26-Update.zip\",1094818,\"sha256:78009e4ca4ccefb37a9aec1b319210b82c03afcc318d5009dfcad8674b96d6f3\"],[658923723,\"RA2-Toolbox-v1.0.26-Windows.zip\",144353923,\"sha256:91e056ae44606f7567665d8ed26eeec78f05cf24b4377f5a7bcbfbfdf4a53ef9\"]]}]")
          DEPENDENCY = json.loads("{\"name\":\"RA2Toolbox-1.0.48-x64-Dependencies.zip\",\"size\":104375534,\"digest\":\"sha256:dd6b89dacda804b9e3d108082bbc4fdb1fcffe1732eab9b6dfea27702e7fd37b\",\"source_tag\":\"v1.0.48\"}")
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          def api(path, data=None):
              command = ["gh", "api", "--hostname", "github.com", "repos/" + REPO + "/" + path]
              if data is not None:
                  command += ["--method", "PATCH", "--input", "-"]
              result = subprocess.run(command, input=None if data is None else json.dumps(data), text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout)
          def assets(release):
              return sorted([[a["id"], a["name"], a["size"], a.get("digest")] for a in release["assets"]])
          all_before = api("releases?per_page=100")
          assert len(all_before) < 100, "Unexpected pagination; stop for review"
          known = {r["id"] for r in EXPECTED} | {KEEP_ID}
          assert {r["id"] for r in all_before if not r["draft"]} <= known, "An unexpected release appeared"
          latest = api("releases/latest")
          assert latest["id"] == KEEP_ID and latest["tag_name"] == KEEP_TAG and not latest["draft"]
          print("::group::Release metadata before visibility changes")
          print(json.dumps(all_before, ensure_ascii=False))
          print("::endgroup::")
          original_latest_assets = assets(latest)
          assert pathlib.PurePosixPath(DEPENDENCY["name"]).name == DEPENDENCY["name"]
          current_dep = next((a for a in latest["assets"] if a["name"] == DEPENDENCY["name"]), None)
          if current_dep is None:
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run(["gh", "release", "download", DEPENDENCY["source_tag"], "--repo", REPO, "--pattern", DEPENDENCY["name"], "--dir", directory], check=True)
                  file = pathlib.Path(directory) / DEPENDENCY["name"]
                  assert file.stat().st_size == DEPENDENCY["size"]
                  assert "sha256:" + hashlib.file_digest(file.open("rb"), "sha256").hexdigest() == DEPENDENCY["digest"]
                  subprocess.run(["gh", "release", "upload", KEEP_TAG, str(file), "--repo", REPO], check=True)
          latest = api("releases/" + str(KEEP_ID))
          assert all(a in assets(latest) for a in original_latest_assets), "An existing latest asset changed"
          current_dep = next(a for a in latest["assets"] if a["name"] == DEPENDENCY["name"])
          assert current_dep["size"] == DEPENDENCY["size"] and current_dep.get("digest") == DEPENDENCY["digest"]
          old_link = "https://github.com/" + REPO + "/releases/tag/" + DEPENDENCY["source_tag"]
          new_link = current_dep["browser_download_url"]
          if old_link in latest["body"]:
              latest = api("releases/" + str(KEEP_ID), {"body": latest["body"].replace(old_link, new_link)})
          assert not latest["draft"] and not latest["prerelease"]
          completed = []
          for expected in EXPECTED:
              path = "releases/" + str(expected["id"])
              original = api(path)
              assert original["tag_name"] == expected["tag"] and not original.get("immutable", False)
              assert assets(original) == sorted(expected["assets"]), "Original release assets changed"
              if not original["draft"]:
                  api(path, {"draft": True})
              after = api(path)
              assert after["draft"] and assets(after) == assets(original)
              for key in ("id", "tag_name", "name", "body", "target_commitish", "prerelease"):
                  assert after[key] == original[key], "Unexpected metadata change: " + key
              completed.append(after["tag_name"])
              print("DRAFT VERIFIED: " + after["tag_name"] + "; assets=" + str(len(after["assets"])))
          all_after = api("releases?per_page=100")
          assert {r["id"] for r in all_after if not r["draft"]} == {KEEP_ID}
          assert {r["id"] for r in all_after if r["draft"]} == {r["id"] for r in EXPECTED}
          assert api("releases/latest")["id"] == KEEP_ID
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as output:
              output.write("# Release visibility updated\n\nPublic release: " + KEEP_TAG + "\n\n" + str(len(completed)) + " older releases retained as drafts with their original assets.\n\nThe shared dependency archive was copied and SHA256 verified on the public release.\n")
          print("SUCCESS: one public release, " + str(len(completed)) + " retained drafts")
          
          PY
