name: Keep only the latest release public
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-public-release-20261110.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-public-release-20261110
  cancel-in-progress: false
jobs:
  archive-old-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve dependency archive and retain older releases as drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile
          REPO = "ARISAKAHIKARI/RA2-Toolbox-Build"
          KEEP_ID = 440368602
          KEEP_TAG = "v1.0.48.1"
          EXPECTED = json.loads("[{\"id\":440336551,\"tag\":\"v1.0.48\",\"assets\":[[731379170,\"RA2Toolbox-1.0.48-release-manifest.json\",15362,\"sha256:d8b867e10504fac42fa2b0a961542d39c4ed51645a13709fe6c25635160ed61a\"],[731379189,\"RA2Toolbox-1.0.48-SHA256SUMS.txt\",508,\"sha256:a69c82de4661b43ad4032114072b980d77c81447e591c680f158c94edb8aa85f\"],[731379144,\"RA2Toolbox-1.0.48-verification.zip\",86670,\"sha256:abae26814bf032a9336be86e3961d7218d63737acaf2c68b9e486a0f5b53a7a4\"],[731365556,\"RA2Toolbox-1.0.48-x64-Dependencies.zip\",104375534,\"sha256:dd6b89dacda804b9e3d108082bbc4fdb1fcffe1732eab9b6dfea27702e7fd37b\"],[731379111,\"RA2Toolbox-1.0.48-x64-Full.zip\",4512198,\"sha256:a751e7d5ec76724426f72ed85bf4d5dc0362199d6c43069f70c774d8b2404a8b\"],[731379076,\"RA2Toolbox-1.0.48-x64-Update.zip\",4126740,\"sha256:75ab9199408960d1dc065e51fe819c360b1c99b06d690138ab13685ee442c0d2\"]]},{\"id\":439404831,\"tag\":\"v1.0.47\",\"assets\":[[728243179,\"RA2Toolbox-1.0.47-verification.zip\",480578,\"sha256:6d8ec99934fa5de64738f6ab843a134a42feb7d2f5eca69e6e414411cceb8e94\"],[728243092,\"RA2Toolbox-1.0.47-x64-Full.zip\",4491660,\"sha256:cfeb5d0942455a6a1657153b849e61d5be9aa72ef868a7f3e2f56d8a28325ed4\"],[728243137,\"RA2Toolbox-1.0.47-x64-Update.zip\",4100076,\"sha256:0037ad79e0681c58e388d929c6f48ac28e0490173dca50ef9dcbc20af0f0255b\"],[728243168,\"release-manifest.json\",218654,\"sha256:846220f0383f9555e3bc19108c01c6c32d336f3f8ebc5caca0fad37a8c3e1283\"],[728243200,\"SHA256SUMS.txt\",385,\"sha256:16058a0bd43e14fb272896b18848bd3b9a9bf60fe83bd94e9930a15bdccc9e5e\"]]},{\"id\":438335259,\"tag\":\"v1.0.46\",\"assets\":[[724480753,\"archive-1.0.46.3-Full.zip\",4427616,\"sha256:c5e1ee4d2bcdb727e35e5c81ca95119db6d5f20edc4f65394c9fbd013dbd7c78\"],[724480899,\"archive-1.0.46.3-release-manifest.json\",261267,\"sha256:888d2334d5c00a02f2f6859b04e667fdfd8729bd6ebe753d6765ef00e9d42920\"],[724480920,\"archive-1.0.46.3-SHA256SUMS.txt\",284,\"sha256:f9a0377e775caa16cd5c07ebc62170de16df68f3753eaf1f75704