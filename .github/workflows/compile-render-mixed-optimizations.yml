name: Compile mixed scene render corrections
on:
  push:
    branches: [codex/render-mixed-optimizations-20261105]
    paths: [source/**, .github/workflows/compile-render-mixed-optimizations.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-mixed-corrections-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
      - name: Install Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          mkdir -p diagnostics
          driver=$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*.json")))')
          test -n "$driver"
          echo "VK_ICD_FILENAMES=$driver" >> "$GITHUB_ENV"
          cat "$driver" > diagnostics/vulkan-driver.json
      - name: Compare actual Vulkan cold and partial native pages
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -pthread source/assist/tests/gpu_phase_csr.cpp -o /tmp/gpu-phase-csr-host
          /tmp/gpu-phase-csr-host > diagnostics/phase-csr-host.log
          cat diagnostics/phase-csr-host.log
          g++ -std=c++17 -O2 -pthread source/assist/tests/object_canvas_terrain_prefix.cpp source/third_party/xbrz/xbrz.cpp -o /tmp/cpu-terrain-prefix
          /tmp/cpu-terrain-prefix > diagnostics/cpu-terrain-prefix.log
          cat diagnostics/cpu-terrain-prefix.log
          g++ -std=c++17 -O2 -pthread -DRA2_VULKAN_TEST_SOFTWARE source/assist/tests/gpu_area_cloak_reuse.cpp source/third_party/xbrz/xbrz.cpp -ldl -o /tmp/ra2-gpu-area-cloak
          /tmp/ra2-gpu-area-cloak --require > diagnostics/gpu-area-cloak.log 2>&1 || { cat diagnostics/gpu-area-cloak.log; exit 1; }
          cat diagnostics/gpu-area-cloak.log
          g++ -std=c++17 -O2 -pthread -DRA2_VULKAN_TEST_SOFTWARE source/assist/tests/gpu_phase_csr_vulkan.cpp source/third_party/xbrz/xbrz.cpp -ldl -o /tmp/gpu-phase-csr
          /tmp/gpu-phase-csr --require > diagnostics/gpu-phase-csr.log 2>&1 || { tail -80 diagnostics/gpu-phase-csr.log; exit 1; }
          cat diagnostics/gpu-phase-csr.log
      - name: Preserve GPU comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-pre13-Vulkan-comparison
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force artifacts/console,diagnostics | Out-Null
      - name: Compile modern x64 host and paired x86 Runtime and broker
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/artifacts/console"
          bash source/build-zig-x64.sh > diagnostics/console-build.log 2>&1 || { tail -100 diagnostics/console-build.log; exit 1; }
          tail -50 diagnostics/console-build.log
          python source/tools/verify_windows_outputs.py --root artifacts/console --host-arch x64 --webview2
      - name: Record identity and assemble update package
        shell: python
        run: |
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path('artifacts/console')
          names=['RA2Toolbox.exe','GameRuntime.dll','GameRuntimeHost32.exe','WebView2Loader.dll']
          files=[dict(name=n,bytes=(root/n).stat().st_size,sha256=hashlib.sha256((root/n).read_bytes()).hexdigest()) for n in names]
          info=dict(version='1.0.41-pre.13',commit=os.environ['GITHUB_SHA'],branch=os.environ['GITHUB_REF_NAME'],host='x64',runtime='x86',broker='x86',console='WebView2',game_tested=False,multiplayer_tested=False,files=files)
          Path('diagnostics/paired-build.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          readme='RA2 Toolbox 1.0.41-pre.13 (x64)\n\nExit both the game and toolbox before replacing all included files together. Preserve your existing INI, assets and cache. Requires Microsoft Edge WebView2 Evergreen Runtime.\n\nCorrections: globally bounded immutable CPU terrain prefixes avoid repeated static rasterization; bounded per-phase GPU reference lists preserve ordered cloak rendering while reducing repeated candidates in both viewport and native page paths. Includes pre.12 CPU/GPU/cache improvements and previous Hook recovery and attack-own-ground.\n\nCompiled from '+info['commit']+'. Real-game FPS and multiplayer acceptance remain unverified.\n'
          package=Path('artifacts/RA2Toolbox-1.0.41-pre.13-x64-Update.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n in names:z.write(root/n,n)
              for p in sorted((root/'licenses').rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(root))
              z.writestr('UPDATE_README.txt',readme)
          info['package']=dict(name=package.name,bytes=package.stat().st_size,sha256=hashlib.sha256(package.read_bytes()).hexdigest())
          Path('diagnostics/paired-build.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
      - name: Upload update package and build identity
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.41-pre.13-x64-Update
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/RA2Toolbox-1.0.41-pre.13-x64-Update.zip
            diagnostics/paired-build.json
            artifacts/console/BUILD_SOURCE_MANIFEST.json
            artifacts/console/BUILD_TARGET.json
            artifacts/console/WINDOWS_BUILD_ARTIFACTS.json
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-render-cost-build-log
          retention-days: 14
          if-no-files-found: warn
          path: diagnostics/console-build.log

  windows-benchmark:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force artifacts/mixed,diagnostics | Out-Null
      - name: Compile standalone x64 CPU and hardware GPU scene runners
        shell: bash
        run: |
          set -euo pipefail
          ZIG="$(cygpath -u "$ZIG_EXE")"
          "$ZIG" c++ -target x86_64-windows-gnu -std=c++17 -O2 source/assist/tests/cpu_mixed_render_stress.cpp source/third_party/xbrz/xbrz.cpp -o artifacts/mixed/CPU-MixedScene.exe -lkernel32 -luser32 -lgdi32
          "$ZIG" c++ -target x86_64-windows-gnu -std=c++17 -O2 source/assist/tests/gpu_mixed_render_stress.cpp source/third_party/xbrz/xbrz.cpp -o artifacts/mixed/GPU-MixedScene.exe -lkernel32 -luser32 -lgdi32
      - name: Package reproducible scene runners
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,zipfile
          root=Path('artifacts/mixed')
          for tier,flag in [('Medium',''),('High','--high')]:
              gpu=tier.lower()
              text='@echo off\ncd /d "%~dp0"\nGPU-MixedScene.exe --tier '+gpu+' --frames 300 --warmup 20 --path both --json GPU-'+tier+'.json --preview GPU-'+tier+'\nCPU-MixedScene.exe '+flag+' --frames 300 --warmup 20 --output CPU-'+tier+'.json --preview CPU-'+tier+'.ppm\npause\n'
              (root/('Run-'+tier+'.cmd')).write_text(text,encoding='ascii')
          readme='RA2 Toolbox pre.13 mixed rendering benchmark\n\nRun Run-Medium.cmd or Run-High.cmd. This standalone program uses generated TMP/SHP-RLE/VXL-HVA assets; it does not open or modify the game. GPU runner requires hardware Vulkan. Reports contain complete-frame compute timings and headless throughput, not display or game FPS.\n\nMedium:4096 terrain,256 SHP,128 VXL,64 animations,192 particles,24 beams. High:16384 terrain,1024 SHP,512 VXL,256 animations,768 particles,96 beams. All objects/effects animate, terrain lighting changes every60updates. Warmup20+measured300updates; three cold checks run after the timing loop.\n\nSend the generated CPU/GPU JSON reports for analysis. Full RGBA readback is included. Renderer initialization, game sampling and Windows presentation are excluded from steady-state timings. PPM previews show actual output.\n\nSource: https://github.com/ARISAKAHIKARI/RA2-Toolbox-Build/tree/'+os.environ['GITHUB_SHA']+'/source/assist/tests\n'
          (root/'README.txt').write_text(readme,encoding='utf-8')
          (root/'licenses').mkdir(exist_ok=True)
          for src,name in [('LICENSE-GPL','GPL-3.0.txt'),('source/third_party/xbrz/License.txt','xBRZ-License.txt')]:
              (root/'licenses'/name).write_bytes(Path(src).read_bytes())
          files=[dict(name=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.glob('*.exe'))]
          info=dict(commit=os.environ['GITHUB_SHA'],architecture='x64',kind='headless synthetic mixed rendering benchmark',files=files)
          (root/'BUILD.json').write_text(json.dumps(info,indent=2)+'\n')
          target=Path('artifacts/RA2Toolbox-pre13-MixedScene-Benchmark-x64.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(root))
      - uses: actions/upload-artifact@v4
        with:
          name: MixedScene-pre13-Benchmark-Windows-x64
          retention-days: 14
          if-no-files-found: error
          path: artifacts/RA2Toolbox-pre13-MixedScene-Benchmark-x64.zip
