name: Inspect official NGX Neural Rendering package
on:
  push:
    branches: [codex/dlss5-ngx-probe-20261029]
    paths: [.github/workflows/inspect-dlss5-ngx.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve official public Remix SDK dependency without executing SDK binaries
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, subprocess, urllib.request, zipfile
          out=pathlib.Path('nr-sdk-inspection'); out.mkdir()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'nr-packman'; root.mkdir()
          pm=root/'packman'; (pm/'bootstrap').mkdir(parents=True)
          pin='0ba9973fd856e29fe9cf8dd2f2bc754bcbb2037a'
          origin='https://raw.githubusercontent.com/NVIDIAGameWorks/dxvk-remix/'+pin+'/'
          for rel in ('packman','config.packman.xml','bootstrap/install_package.py'):
              data=urllib.request.urlopen(origin+'scripts-common/packman/'+rel,timeout=120).read()
              (pm/rel).write_bytes(data)
              print('OFFICIAL_BOOTSTRAP',rel,len(data),hashlib.sha256(data).hexdigest())
          config=(pm/'config.packman.xml').read_bytes()
          (root/'config.packman.xml').write_bytes(config)
          manifest=root/'only-neural-rendering.packman.xml'
          manifest.write_text('<project toolsVersion="7.20"><dependency name="ngx_sdk_dlnr" linkPath="sdk"><package name="rtx-remix-ngx_sdk_dlnr" version="2" /></dependency></project>')
          environment=dict(os.environ,PM_PYTHON_EXT='/usr/bin/python3',PM_PACKAGES_ROOT=str(root/'cache'))
          subprocess.run(['bash',str(pm/'packman'),'pull',str(manifest)],cwd=root,env=environment,check=True)
          sdk=root/'sdk'
          assert sdk.is_dir()
          inventory={'resolver':'NVIDIA Packman 8.7.0','official_source_pin':pin,'package':'rtx-remix-ngx_sdk_dlnr','version':'2','entries':[],'copied':[]}
          for item in sorted(sdk.rglob('*')):
              if not item.is_file(): continue
              p=item.relative_to(sdk); suffix=p.suffix.lower(); data=item.read_bytes()
              entry={'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              if suffix=='.dll':
                  assert data[:2]==b'MZ'; pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'
                  entry['machine']=hex(struct.unpack_from('<H',data,pe+4)[0])
              inventory['entries'].append(entry)
              print('NR_PACKAGE_ENTRY',json.dumps(entry,sort_keys=True))
              lower=str(p).lower()
              istext=suffix in ('.h','.hpp','.inl','.txt','.md','.xml','.json','.pdf','.html')
              islib=suffix=='.lib' and ('x64' in lower or 'x86_64' in lower or 'x86-64' in lower)
              if istext or islib:
                  target=out/'sdk'/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  inventory['copied'].append(entry)
          (out/'inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-ngx-neural-rendering-contract
          path: nr-sdk-inspection
          if-no-files-found: error
          retention-days: 7
