name: Inspect official NGX Neural Rendering package
on:
  push:
    branches: [codex/dlss5-ngx-probe-20261029]
    paths: [.github/workflows/inspect-dlss5-ngx.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch official public Remix dependency and inspect SDK contract
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, urllib.request, urllib.error, zipfile
          out = pathlib.Path('nr-sdk-inspection'); out.mkdir()
          archive = pathlib.Path(os.environ['RUNNER_TEMP'])/'rtx-remix-ngx_sdk_dlnr-2.zip'
          bases = ['https://d1oqksizpb0e3d.cloudfront.net/', 'https://d4i3qtqj3r0z5.cloudfront.net/']
          source = None
          errors = []
          for base in bases:
              url = base+'rtx-remix-ngx_sdk_dlnr@2.zip'
              try:
                  request = urllib.request.Request(url,headers={'User-Agent':'RA2Toolbox-official-NR-SDK-inspection'})
                  with urllib.request.urlopen(request,timeout=120) as response, archive.open('wb') as target:
                      count=0
                      while chunk:=response.read(1024*1024):
                          count+=len(chunk); assert count<=512*1024*1024
                          target.write(chunk)
                  source=url; break
              except urllib.error.HTTPError as error:
                  errors.append({'url':url,'status':error.code})
                  print('PACKAGE_LOCATION_ERROR',url,error.code)
          assert source is not None, errors
          raw=archive.read_bytes(); assert zipfile.is_zipfile(archive)
          print('OFFICIAL_NR_PACKAGE',source,len(raw),hashlib.sha256(raw).hexdigest())
          inventory={'source':source,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'errors':errors,'entries':[],'copied':[]}
          with zipfile.ZipFile(archive) as sdk:
              assert sdk.testzip() is None
              for info in sdk.infolist():
                  if info.is_dir(): continue
                  p=pathlib.PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  entry={'path':info.filename,'bytes':info.file_size}
                  suffix=p.suffix.lower()
                  if suffix=='.dll':
                      data=sdk.read(info); assert data[:2]==b'MZ'
                      pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'
                      entry['machine']=hex(struct.unpack_from('<H',data,pe+4)[0])
                      entry['sha256']=hashlib.sha256(data).hexdigest()
                  inventory['entries'].append(entry)
                  print('NR_PACKAGE_ENTRY',json.dumps(entry,sort_keys=True))
                  lower=info.filename.lower()
                  istext=suffix in ('.h','.hpp','.inl','.txt','.md','.xml','.json','.pdf','.html')
                  islib=suffix=='.lib' and ('x64' in lower or 'x86_64' in lower or 'x86-64' in lower)
                  if istext or islib:
                      data=sdk.read(info)
                      target=out/'sdk'/str(p);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                      inventory['copied'].append({'path':str(target.relative_to(out)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          archive.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-ngx-neural-rendering-contract
          path: nr-sdk-inspection
          if-no-files-found: error
          retention-days: 7
