name: Inspect official NGX Neural Rendering package
on:
  push:
    branches: [codex/dlss5-ngx-probe-20261029]
    paths: [.github/workflows/inspect-dlss5-ngx.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official public Remix SDK dependency without executing SDK binaries
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, subprocess, urllib.request, zipfile
          out=pathlib.Path('nr-sdk-inspection'); out.mkdir()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'nr-packman'; root.mkdir()
          pm=root/'packman'; (pm/'bootstrap').mkdir(parents=True)
          pin='0ba9973fd856e29fe9cf8dd2f2bc754bcbb2037a'
          origin='https://raw.githubusercontent.com/NVIDIAGameWorks/dxvk-remix/'+pin+'/'
          for rel in ('packman','config.packman.xml','bootstrap/install_package.py'):
              data=urllib.request.urlopen(origin+'scripts-common/packman/'+rel,timeout=120).read()
              (pm/rel).write_bytes(data)
              print('OFFICIAL_BOOTSTRAP',rel,len(data),hashlib.sha256(data).hexdigest())
          config=(pm/'config.packman.xml').read_bytes()
          (root/'config.packman.xml').write_bytes(config)
          manifest=root/'only-neural-rendering.packman.xml'
          manifest.write_text('<project toolsVersion="7.20"><dependency name="ngx_sdk_dlnr" linkPath="sdk"><package name="rtx-remix-ngx_sdk_dlnr" version="2" /></dependency></project>')
          environment=dict(os.environ,PM_PYTHON_EXT='/usr/bin/python3',PM_PACKAGES_ROOT=str(root/'cache'))
          subprocess.run(['bash',str(pm/'packman'),'pull',str(manifest)],cwd=root,env=environment,check=True)
          sdk=root/'sdk'
          assert sdk.is_dir()
          inventory={'resolver':'NVIDIA Packman 8.7.0','official_source_pin':pin,'package':'rtx-remix-ngx_sdk_dlnr','version':'2','entries':[],'copied':[],'base_entries':[]}
          base_pin='374959484e79a640feaba44c93ac8cfb0a03f5b5'
          tree_url='https://api.github.com/repos/NVIDIA/DLSS/git/trees/'+base_pin+'?recursive=1'
          request=urllib.request.Request(tree_url,headers={'User-Agent':'RA2Toolbox-NGX-SDK-dependency'})
          base_tree=json.loads(urllib.request.urlopen(request,timeout=120).read())
          assert not base_tree['truncated']
          wanted_libs={'lib/Windows_x86_64/vs2010/x64/nvsdk_ngx_s.lib','lib/Windows_x86_64/x64/nvsdk_ngx_s.lib'}
          for item in base_tree['tree']:
              name=item['path']
              if item['type']!='blob' or not (name=='LICENSE.txt' or name.startswith('include/') and name.endswith('.h') or name in wanted_libs):continue
              data=urllib.request.urlopen('https://raw.githubusercontent.com/NVIDIA/DLSS/'+base_pin+'/'+name,timeout=120).read()
              git_blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert git_blob==item['sha'],name
              target=out/'sdk'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              record={'path':name,'bytes':len(data),'git_blob':git_blob,'sha256':hashlib.sha256(data).hexdigest()}
              inventory['base_entries'].append(record);print('BASE_SDK_ENTRY',json.dumps(record,sort_keys=True))
          assert wanted_libs<={item['path'] for item in inventory['base_entries']}
          inventory['base_sdk_commit']=base_pin
          for item in sorted(sdk.rglob('*')):
              if not item.is_file(): continue
              p=item.relative_to(sdk); suffix=p.suffix.lower(); data=item.read_bytes()
              entry={'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              if suffix=='.dll':
                  assert data[:2]==b'MZ'; pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'
                  entry['machine']=hex(struct.unpack_from('<H',data,pe+4)[0])
                  key='VS_VERSION_INFO\0'.encode('utf-16-le')
                  cursor=0; versions=[]
                  while (at:=data.find(key,cursor))>=0:
                      cursor=at+len(key)
                      if at<6: continue
                      length,value_size,kind=struct.unpack_from('<HHH',data,at-6)
                      value=(at+len(key)+3)&~3
                      if value_size==52 and kind==0 and value+52<=at-6+length and data[value:value+4]==b'\xbd\x04\xef\xfe':
                          ms,ls=struct.unpack_from('<II',data,value+8)
                          versions.append('.'.join(map(str,(ms>>16,ms&65535,ls>>16,ls&65535))))
                  if versions: entry['file_versions']=sorted(set(versions))
              inventory['entries'].append(entry)
              print('NR_PACKAGE_ENTRY',json.dumps(entry,sort_keys=True))
              istext=suffix in ('.h','.hpp','.inl','.txt','.md','.xml','.json','.pdf','.html')
              if istext:
                  target=out/'sdk'/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  inventory['copied'].append(entry)
          url='https://d1oqksizpb0e3d.cloudfront.net/rtx-remix-ngx_sdk_dlnr%402.7z'
          digest=hashlib.sha256(); size=0
          with urllib.request.urlopen(url,timeout=120) as source:
              while chunk:=source.read(1024*1024):
                  size+=len(chunk); assert size<=512*1024*1024; digest.update(chunk)
          inventory['archive']={'url':url,'bytes':size,'sha256':digest.hexdigest()}
          print('NR_ARCHIVE_VERIFIED_SOURCE',json.dumps(inventory['archive']))
          (out/'inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          PY
      - name: Exercise shipped SDK bootstrap from a fresh directory including runtime verification
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'nr-packman'/'cache'
          sevenzip=next(path for path in cache.rglob('7zz') if path.is_file() and path.read_bytes()[:4]==b'\x7fELF' and path.read_bytes()[18:20]==b'\x3e\x00')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'reproducible-neural-sdk'
          command=['python3','source/tools/fetch_neural_sdk.py','--output',str(output),'--sevenzip',str(sevenzip),'--include-runtime']
          subprocess.run(command,check=True)
          subprocess.run(['python3','source/tools/fetch_neural_sdk.py','--output',str(output),'--include-runtime','--verify-only'],check=True)
          print('SDK_BOOTSTRAP_FRESH_AND_RUNTIME_HASH_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-ngx-neural-rendering-contract
          path: nr-sdk-inspection
          if-no-files-found: error
          retention-days: 7
