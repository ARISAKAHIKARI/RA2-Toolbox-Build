name: Publish RA2 Toolbox 1.0.52-pre.7 checked async candidate
on:
  push:
    branches: [release/1.0.52-pre.7-host-world-fix-20261120]
    paths:
      - .github/workflows/publish-1.0.52-pre.7-host-world-once.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ra2toolbox-1.0.52-pre.7-release-once
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source lineage, pre7 version, async default and core regressions
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e0722c1b8e6b1af6d5a74488ecdff01f76e7d6f HEAD
          grep -q '^#define RA2_RELEASE_VERSION "1.0.52.7"$' source/shared/source/release_version.h
          grep -q '^#define RA2_RELEASE_VERSION_W L"1.0.52-pre.7"$' source/shared/source/release_version.h
          grep -q 'ASSIST_PROTOCOL = 112' source/tools/verify_windows_outputs.py
          grep -q 'ASSIST_SHARED_BYTES = 23228768' source/tools/verify_windows_outputs.py
          grep -q 'ObservationReadScope' source/assist/source/world_frame_runtime.h
          grep -q 'ObservationOnlyKeyBit' source/shared/source/world_frame.h
          grep -q 'hostWriter.publish(publication' source/shared/source/world_frame_command_worker_win.h
          grep -q 'hostPublishedSerial_' source/shared/source/world_frame_command_worker_win.h
          grep -q 'client->acquire(match)' source/assist/tests/world_frame_async_dll.cpp
          grep -q 'FrameUnavailable' source/assist/source/watch_scene.h
          grep -q 'sampling-health pid=' source/assist/source/main.cpp
          grep -q 'runtime-async-candidate' source/assist/tests/world_frame_async_windows.py
          grep -q 'RestartAfterStop' source/assist/tests/world_frame_command_worker_host.cpp
          grep -q 'return !(length==1&&setting\[0\]==.0.);' source/shared/source/world_frame_command_worker_win.h
          python3 source/assist/tests/async_command_no_live_roster.py
          python3 source/assist/tests/world_frame_core_test.py
          python3 source/assist/tests/construction_host_test.py
          python3 source/assist/tests/construction_paint_test.py
          python3 source/assist/tests/ore_harvest_handoff.py --out /tmp/pre7-ore
          python3 source/assist/tests/unload_loaded_admission.py --out /tmp/pre7-unload --current-only
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/async_command_policy.cpp -o /tmp/pre7-policy
          /tmp/pre7-policy
          g++ -std=c++17 -O2 -UNDEBUG -Wall -Wextra -fsanitize=undefined -fno-sanitize-recover=all source/assist/tests/execution_proof.cpp -o /tmp/pre7-proof
          /tmp/pre7-proof
  native:
    needs: portable
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Zig 0.13.0 and icon encoder
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV ('ZIG_EXE='+(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)
          python -m pip install Pillow==11.3.0
      - name: Build paired x64 Host and x86 Runtime with matching ABI
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/pre7-build"
          mkdir -p checks
          bash source/build-zig-x64.sh > checks/windows-build.log 2>&1 || { tail -120 checks/windows-build.log; exit 1; }
          python source/tools/verify_windows_outputs.py --root pre7-build --host-arch x64 --webview2
          python -c "import json; p=json.load(open('pre7-build/BUILD_TARGET.json')); assert (p['host'],p['runtime'],p['broker'],p['assist_protocol'],p['game_tested'])==('x64','x86','x86',112,False),p"
          for n in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll BUILD_TARGET.json WINDOWS_BUILD_ARTIFACTS.json; do test -s "pre7-build/$n"; done
      - name: Test native x86/x64 default-on command and publication worker lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          python source/assist/tests/world_frame_command_worker_windows.py --zig "$ZIG" --out checks/command
          python source/assist/tests/world_frame_async_windows.py --zig "$ZIG" --out checks/publication
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ra2toolbox-pre7-paired-windows
          retention-days: 30
          path: |
            pre7-build/*.exe
            pre7-build/*.dll
            pre7-build/*.json
            pre7-build/licenses/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra2toolbox-pre7-build-evidence
          retention-days: 30
          path: checks/
  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.52-pre.7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ra2toolbox-pre7-paired-windows
          path: dist/update
      - name: Assemble checked Update and optional Full with complete resources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = release/1.0.52-pre.7-host-world-fix-20261120
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing pre-release tag" >&2
            exit 1
          fi
          for n in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll BUILD_TARGET.json WINDOWS_BUILD_ARTIFACTS.json; do test -s "dist/update/$n"; done
          python3 - <<'PY'
          import json
          p=json.load(open('dist/update/BUILD_TARGET.json'))
          assert (p['host'],p['runtime'],p['broker'],p['assist_protocol'],p['game_tested'])==('x64','x86','x86',112,False),p
          PY
          cat > dist/update/BUILD_VALIDATION.txt <<EOF
          RA2 Toolbox 1.0.52-pre.7 | source $GITHUB_SHA
          Paired x64 Host / x86 Runtime and x86 broker | Assist ABI 112
          Off-thread complete world snapshots published to Host IPC as observation-only data.
          Exact-frame native order authority remains strict; game-tested=false.
          To switch to old synchronous mode before launch: RA2TOOLBOX_ASYNC_COMMAND_CAPTURE=0
          Offline and Win32 x86/x64 candidate, restart and worker tests passed.
          Actual gameplay, JJ/CnCNet multiplayer success and FPS: NOT TESTED.
          Back up settings; close game and toolbox; replace all paired EXE and DLL files together.
          EOF
          (cd dist/update && zip -q -r ../RA2Toolbox-1.0.52-pre.7-x64-Update.zip .)
          unzip -tq dist/RA2Toolbox-1.0.52-pre.7-x64-Update.zip
          mkdir -p dist/base dist/full
          gh release download v1.0.52-pre.2 --repo "$GITHUB_REPOSITORY" --pattern 'RA2Toolbox-1.0.52-pre.2-x64-Full.zip' --dir dist/base
          unzip -tq dist/base/RA2Toolbox-1.0.52-pre.2-x64-Full.zip
          unzip -q dist/base/RA2Toolbox-1.0.52-pre.2-x64-Full.zip -d dist/full
          test "$(find dist/full -type f -name RA2Toolbox.exe | wc -l)" -eq 1
          root="$(dirname "$(find dist/full -type f -name RA2Toolbox.exe -print -quit)")"
          test -n "$root"
          for n in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll; do cp "dist/update/$n" "$root/$n"; cmp "dist/update/$n" "$root/$n"; done
          for n in BUILD_TARGET.json WINDOWS_BUILD_ARTIFACTS.json BUILD_SOURCE_MANIFEST.json BUILD_VALIDATION.txt; do test ! -f "dist/update/$n" || cp "dist/update/$n" "$root/$n"; done
          if test -d dist/update/licenses; then mkdir -p "$root/licenses"; cp -a dist/update/licenses/. "$root/licenses/"; fi
          (cd dist/full && zip -q -r ../RA2Toolbox-1.0.52-pre.7-x64-Full.zip .)
          unzip -tq dist/RA2Toolbox-1.0.52-pre.7-x64-Full.zip
          (cd dist && sha256sum RA2Toolbox-1.0.52-pre.7-x64-Update.zip RA2Toolbox-1.0.52-pre.7-x64-Full.zip > SHA256SUMS.txt)
      - name: Create verified prerelease (leave Latest untouched)
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/RELEASE_NOTES.md <<EOF
          ## RA2 Toolbox v1.0.52-pre.7 · Host 世界采样发布全局修复（实机测试版）

          基于 PR #65 修复提交 \`8e0722c1\`；当前构建 \`$GITHUB_SHA\`。x64 Host、x86 GameRuntime、x86 Broker 配套 ABI v112。

          - 修复 pre.6 的共同故障：后台每 5 秒完成 311 份图，但 Host publications=0、严格同帧 strictAdopted=0，导致 UI 世界数据长期停滞。新版本让后台工作线程直接把已封存的完整世界图发布到 Host 共享内存，不依赖同帧 EventClass 收件。
          - 预计受益的功能包括预定面板候选、单位统计、第二摄像头跟踪以及其他 Host 场景订阅者。实机日志中 Watch 渲染任务 311 次全部失败，绝大多数在获取世界帧阶段返回；没有擅自改变相机 GPU 绘制逻辑。
          - 安全隔离：后台图以 ObservationOnlyKeyBit 明确标记，仅供规划/显示使用，不能直接授权现帧原生命令；下令前仍验证实时 UID、House 和原生权限。
          - 保持后台 128KB 连续页批量读取，完整页面复制不进入游戏主线程；采样合并、跨帧候选和工作线程重启保护保持。
          - Windows x86/x64 集成回归新增强制检查：同帧、跨帧都必须在真正的 Host Client::acquire 取得含单位数据的共享图；工作流成功才能发布。
          - 采样和性能诊断维持 sampling-health / sampling-work 日志。

          警告：此包尚未经用户真实游戏或 JJ/CnCNet 联机实测，仍是 Pre-release。安装时关闭游戏及工具箱、备份 Assist.ini，并整套覆盖 Host/Runtime/Broker，不能单换 DLL。
          建议先测预定面板、单位统计、第二摄像头跟踪，再测 Ctrl+D、自动装车/倒矿。若仍大量失效，可回退 v1.0.52-pre.4，或在启动前设置 RA2TOOLBOX_ASYNC_COMMAND_CAPTURE=0 临时使用同步采样。稳定 Latest 未变。
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'RA2 Toolbox 1.0.52-pre.7 · Host世界采样全局修复' --notes-file dist/RELEASE_NOTES.md dist/RA2Toolbox-1.0.52-pre.7-x64-Update.zip dist/RA2Toolbox-1.0.52-pre.7-x64-Full.zip dist/SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | jq -e '.isDraft==false and .isPrerelease==true and ([.assets[].name]|index("RA2Toolbox-1.0.52-pre.7-x64-Update.zip")!=null) and ([.assets[].name]|index("RA2Toolbox-1.0.52-pre.7-x64-Full.zip")!=null)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra2toolbox-pre7-release-evidence
          retention-days: 30
          path: |
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
