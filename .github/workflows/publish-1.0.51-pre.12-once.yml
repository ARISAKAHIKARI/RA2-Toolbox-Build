name: Publish 1.0.51-pre.12 unit-panel and multi-passenger hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1.0.51-pre.12-once.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ra2-toolbox-pre12-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      COMPILED_RUN: '43731901266'
      COMPILED_SHA: '450192845ffff1d01fac3f8af22bcd7baff767e8'
      RELEASE_TAG: 'v1.0.51-pre.12'
    steps:
      - name: Gate on exact source commit and all six build checks
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILED_RUN" --jq '.head_sha')
          test "$actual" = "$COMPILED_SHA"
          ready=false
          for try in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILED_RUN/jobs?per_page=100" > checked-jobs.json
            if jq -e '(["windows-x64","console-browser","console-win32-fixtures","unit-panel-model","ore-dock-and-return","ctrl-d-one-press"] - [.jobs[] | select(.conclusion=="success") | .name] | length) == 0' checked-jobs.json >/dev/null; then
              ready=true
              break
            fi
            if jq -e '[.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")] | length > 0' checked-jobs.json >/dev/null; then
              echo "Required build check failed; refusing to publish"
              jq -r '.jobs[]|[.name,.conclusion]|@tsv' checked-jobs.json
              exit 1
            fi
            sleep 15
          done
          test "$ready" = true
      - name: Download the paired Windows build and validate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/update dist/full dist/base
          gh run download "$COMPILED_RUN" --repo "$GITHUB_REPOSITORY" --name RA2Toolbox-Console-MVVM-x64 --dir dist/update
          for n in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll CONSOLE_COMPILE.json; do
            test -s "dist/update/$n"
          done
          jq -e --arg sha "$COMPILED_SHA" '.commit == $sha and .compile_only == true and .game_tested == false' dist/update/CONSOLE_COMPILE.json
          (cd dist/update && zip -q -r ../RA2Toolbox-1.0.51-pre.12-x64-Update.zip .)
      - name: Prepare Full with approved pre.11 support resources
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.51-pre.11 --repo "$GITHUB_REPOSITORY" --pattern RA2Toolbox-1.0.51-pre.11-x64-Full.zip --dir dist/base
          unzip -q dist/base/RA2Toolbox-1.0.51-pre.11-x64-Full.zip -d dist/full
          exe=$(find dist/full -type f -name RA2Toolbox.exe -print -quit)
          test -n "$exe"
          root=$(dirname "$exe")
          for n in RA2Toolbox.exe GameRuntime.dll GameRuntimeHost32.exe WebView2Loader.dll; do
            test -f "$root/$n"
            cp "dist/update/$n" "$root/$n"
            cmp "dist/update/$n" "$root/$n"
          done
          for n in CONSOLE_COMPILE.json BUILD_SOURCE_MANIFEST.json BUILD_TARGET.json WINDOWS_BUILD_ARTIFACTS.json; do
            if test -f "dist/update/$n"; then cp "dist/update/$n" "$root/$n"; fi
          done
          if test -d dist/update/licenses; then
            mkdir -p "$root/licenses"
            cp -a dist/update/licenses/. "$root/licenses/"
          fi
          (cd dist/full && zip -q -r ../RA2Toolbox-1.0.51-pre.12-x64-Full.zip .)
          unzip -tq dist/RA2Toolbox-1.0.51-pre.12-x64-Full.zip
          unzip -tq dist/RA2Toolbox-1.0.51-pre.12-x64-Update.zip
      - name: Publish pre.12 with accurate experimental validation label
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum RA2Toolbox-1.0.51-pre.12-x64-Update.zip RA2Toolbox-1.0.51-pre.12-x64-Full.zip > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## 改进
          
          - 单位面板改为紧贴游戏左下角的紧凑 Cameo 格子布局；控制台选项仅显示“单位面板”，隐藏冗长说明；默认关闭，可自行开启
          - Ctrl+D 为全部载员建立独立跟进任务，兼容先下车、后续乘员仍在 Limbo 或暂未出现在活跃步兵列表的情况
          - 防止丢失乘员身份或载具手动移动时错误清除其他乘员任务；保留手动命令和对象身份检查
          - 保留上一版的矿车自动倒矿和 Ctrl+D 单按修复
          
          本包编译自 450192845ffff1d01fac3f8af22bcd7baff767e8，Windows x64 Host / x86 Runtime 与桥接程序一起构建。CI 的六个独立检查成功；尚未经过真实游戏与联机实测。内部程序版本可能仍显示 1.0.51.10。
          
          **Full**：独立安装，资源沿用 pre.11 并替换所有配套二进制。**Update**：关闭游戏和工具箱，备份设置后覆盖在 pre.11 完整版目录。不要只替换单个 DLL。
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber RA2Toolbox-1.0.51-pre.12-x64-Update.zip RA2Toolbox-1.0.51-pre.12-x64-Full.zip SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$COMPILED_SHA" --prerelease --title "RA2 Toolbox 1.0.51-pre.12 · 单位面板与多人卸载修复" --notes-file RELEASE_NOTES.md RA2Toolbox-1.0.51-pre.12-x64-Update.zip RA2Toolbox-1.0.51-pre.12-x64-Full.zip SHA256SUMS.txt
          fi
      - name: Hide the previous pre.11 after new Release is public
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == true'
          mkdir -p metadata
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.51-pre.11" > metadata/pre11-release-recovery.json
          id=$(jq -r '.id' metadata/pre11-release-recovery.json)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.draft')" = true
      - name: Preserve release inventory for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.51-pre.12-release-audit
          retention-days: 30
          if-no-files-found: warn
          path: metadata/
