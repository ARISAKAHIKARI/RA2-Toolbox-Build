name: Verify 1.0.50 follow-up Windows fixtures
on:
  push:
    branches: [codex/fix-v150-ci-20261112]
    paths: [source/assist/tests/**, .github/workflows/verify-v150-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining-windows-fixtures:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          Add-Content $env:GITHUB_ENV ('ZIG_EXE='+(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path)
          New-Item -ItemType Directory -Force diagnostics/followup | Out-Null
      - name: Run all independent native regressions
        shell: pwsh
        run: |
          $checks=@(
            @{name='control';script='source/assist/tests/control_parameters_windows.py';args=@('--build-dir','diagnostics/followup/control','--output','diagnostics/followup/control/result.json')},
            @{name='technology';script='source/assist/tests/tech_enhancement_parameter_windows.py';args=@('--build-dir','diagnostics/followup/technology','--output','diagnostics/followup/technology/result.json')},
            @{name='retirement';script='source/assist/tests/tech_ui_publish_windows.py';args=@('--out','diagnostics/followup/retirement')},
            @{name='level-settings';script='source/assist/tests/tech_enhancement_parameter_settings.py';args=@('--build-dir','diagnostics/followup/level-settings','--output','diagnostics/followup/level-settings/result.json')},
            @{name='abi';script='source/tools/verify_crossbit_abi.py';args=@('--output','diagnostics/followup/abi.json')},
            @{name='placement';script='source/tools/test_native_placement.py';args=@('--build-dir','diagnostics/followup/placement')},
            @{name='placement-completion';script='source/assist/tests/native_placement_completion.py';args=@('--out','diagnostics/followup/placement-completion')}
          )
          $results=@()
          foreach($check in $checks){
            $arguments=@($check.script,'--zig',$env:ZIG_EXE)+$check.args
            & python @arguments 2>&1 | Tee-Object ('diagnostics/followup/'+$check.name+'.log')
            $results+=@{name=$check.name;exit_code=$LASTEXITCODE}
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8NoBOM diagnostics/followup/summary.json
          if(@($results | Where-Object { $_.exit_code -ne 0 }).Count){throw 'One or more native regressions failed; see per-check logs'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA2Toolbox-1.0.50-followup-windows
          retention-days: 30
          path: diagnostics/followup/
