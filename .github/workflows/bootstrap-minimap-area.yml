name: Bootstrap minimap GPU area
on:
  push:
    branches: [codex/minimap-area-bootstrap-20261029]
permissions:
  contents: read
jobs:
  area:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official shader tools and software Vulkan
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Generate actual area kernel and execute GPU oracle
        env:
          ASAN_OPTIONS: detect_leaks=0
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -euo pipefail
          python3 source/tools/build_vulkan_area.py --output source/external_reader/source/vulkan_area_spirv.h | tee vulkan-area-kernel.json
          g++ -std=c++17 -O1 -g -UNDEBUG -DRA2_VULKAN_TEST_SOFTWARE -fsanitize=address,undefined -fno-omit-frame-pointer source/assist/tests/vulkan_area.cpp source/third_party/xbrz/xbrz.cpp -ldl -o /tmp/vulkan-area
          /tmp/vulkan-area --require 2>&1 | tee vulkan-area.log
          python3 -c 'from pathlib import Path; import re; assert not re.search("Validation Error|VUID-",Path("vulkan-area.log").read_text())'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimap-area-kernel
          path: |
            source/external_reader/source/vulkan_area_spirv.h
            vulkan-area-kernel.json
            vulkan-area.log
