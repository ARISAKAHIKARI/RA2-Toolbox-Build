name: Ordinary input code-patch boundary
on:
  push:
    branches: [work/latest-ra2-integration]
    paths:
      - 'source/assist/source/hook_policy.h'
      - 'source/assist/source/protocol.h'
      - 'source/assist/source/native_input_hooks.h'
      - 'source/assist/source/auto_cs_bridge.h'
      - 'source/assist/source/cooperative_bridge.h'
      - 'source/assist/source/pointer_bridge.h'
      - 'source/assist/source/native_orders_bridge.h'
      - 'source/assist/source/input_patch.h'
      - 'source/assist/source/placement_bridge.h'
      - 'source/assist/source/direct_modes_bridge.h'
      - 'source/assist/source/network_sender_bridge.h'
      - 'source/assist/source/crc_shadow_bridge.h'
      - 'source/game_runtime/source/frame_signal_runtime.h'
      - 'source/game_runtime/source/native_tooltip_runtime.h'
      - 'source/shared/source/experimental_patch_policy.h'
      - 'source/assist/source/pointer_host.h'
      - 'source/assist/tests/host_input_test.py'
      - 'verification/RETIRED_TEST_CONTRACTS.json'
      - 'source/assist/source/bridge.cpp'
      - 'source/shared/source/host_game_input.h'
      - 'source/shared/source/game_entry_manager.cpp'
      - 'source/assist/tests/hook_policy.cpp'
      - 'source/assist/tests/disabled_feature_policy.cpp'
      - 'source/assist/tests/debug_patch_manager.cpp'
      - 'source/assist/tests/debug_patch_manager.py'
      - 'source/assist/tests/special_patch_inventory_contract.py'
      - 'source/assist/tests/no_interception_source_contract.py'
      - 'source/tools/audit_architecture.py'
      - '.github/workflows/ordinary-input-patch-contract.yml'
  pull_request:
    paths:
      - 'source/assist/source/hook_policy.h'
      - 'source/assist/source/native_input_hooks.h'
      - 'source/assist/source/auto_cs_bridge.h'
      - 'source/assist/source/cooperative_bridge.h'
      - 'source/assist/source/pointer_bridge.h'
      - 'source/assist/source/native_orders_bridge.h'
      - 'source/assist/source/input_patch.h'
      - 'source/assist/source/placement_bridge.h'
      - 'source/assist/source/direct_modes_bridge.h'
      - 'source/assist/source/network_sender_bridge.h'
      - 'source/assist/source/crc_shadow_bridge.h'
      - 'source/game_runtime/source/frame_signal_runtime.h'
      - 'source/game_runtime/source/native_tooltip_runtime.h'
      - 'source/shared/source/experimental_patch_policy.h'
      - 'source/assist/source/pointer_host.h'
      - 'source/assist/tests/host_input_test.py'
      - 'verification/RETIRED_TEST_CONTRACTS.json'
      - 'source/assist/source/bridge.cpp'
      - 'source/shared/source/host_game_input.h'
      - 'source/shared/source/game_entry_manager.cpp'
      - 'source/assist/tests/hook_policy.cpp'
      - 'source/assist/tests/disabled_feature_policy.cpp'
      - 'source/assist/tests/debug_patch_manager.cpp'
      - 'source/assist/tests/debug_patch_manager.py'
      - 'source/assist/tests/no_interception_source_contract.py'
      - 'source/tools/audit_architecture.py'
      - '.github/workflows/ordinary-input-patch-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ordinary-input-patch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify feature flags no longer request input patches
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/hook_policy.cpp -o /tmp/ra2-hook-policy
          /tmp/ra2-hook-policy
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/disabled_feature_policy.cpp -o /tmp/ra2-disabled-policy
          /tmp/ra2-disabled-policy
      - name: Exercise GameEntryManager code/data page protection
        run: python3 source/assist/tests/debug_patch_manager.py --out /tmp/ra2-manager-fixture
      - name: Verify ordinary input routes contain no executable patch path
        run: python3 source/assist/tests/no_interception_source_contract.py
      - name: Verify special patch inventory and explicit opt-in boundaries
        run: python3 source/assist/tests/special_patch_inventory_contract.py
      - name: Exercise the host message-hook and polling manager
        run: python3 source/assist/tests/host_input_test.py
      - name: Verify permitted opt-in patch ownership and source boundaries
        run: python3 source/tools/audit_architecture.py
      - name: Preserve architecture audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-input-patch-boundary-evidence
          retention-days: 14
          if-no-files-found: warn
          path: source/ARCHITECTURE_AUDIT.json
