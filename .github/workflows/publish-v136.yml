name: Publish RA2 Toolbox v1.0.36 Complete Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v136.yml'
      - 'packages/v1.0.36/**'
      - 'source/tools/assemble_v136_windows.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v136
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate complete distribution
        run: |
          mkdir -p baseline dist
          gh release download v1.0.2 --pattern RA2-Toolbox-v1.0.2-Windows.zip --dir baseline
          python3 source/tools/assemble_v136_windows.py --baseline baseline/RA2-Toolbox-v1.0.2-Windows.zip --output-dir dist
          cat dist/full-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish all verified packages
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.0.36'
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            draft=$(python3 -c 'import json; print(str(json.load(open("release-state.json"))["isDraft"]).lower())')
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --latest=true --title 'RA2 Toolbox v1.0.36 — Panels, Waypoints and Tactical Updates' --notes-file packages/v1.0.36/RELEASE_NOTES.md
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release upload "$tag" packages/v1.0.36/RA2-Toolbox-v1.0.36-Update.zip packages/v1.0.36/RA2-Toolbox-v1.0.36-Source.zip dist/RA2-Toolbox-v1.0.36-Windows.zip --clobber
          fi
          mkdir -p remote-check
          gh release download "$tag" --pattern '*.zip' --dir remote-check
          python3 - <<'PY'
          import pathlib,json,hashlib
          assets=json.load(open('packages/v1.0.36/manifest.json'))['assets']
          assets.append(json.load(open('dist/full-manifest.json')))
          for asset in assets:
              p=pathlib.Path('remote-check')/asset['name']
              assert p.stat().st_size==asset['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==asset['sha256']
          PY
          if [ "$draft" = true ]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$tag" --json url,tagName,isDraft,isPrerelease,assets > published-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('published-release.json'))
          assert not r['isDraft'] and not r['isPrerelease']
          assert {a['name'] for a in r['assets']}=={'RA2-Toolbox-v1.0.36-Update.zip','RA2-Toolbox-v1.0.36-Source.zip','RA2-Toolbox-v1.0.36-Windows.zip'}
          PY
          cat published-release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v1.0.36-complete-package-manifest
          path: dist/full-manifest.json
