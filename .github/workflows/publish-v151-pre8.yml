name: Publish RA2 Toolbox 1.0.51-pre.8
run-name: Fix loaded unload jobs and Host exception boundaries 1.0.51-pre.8 (${{ github.sha }})
on:
  push:
    branches: [codex/host-render-crash-20261114]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v151-pre8
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source behavior and retained sampling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-checks
          python source/assist/tests/pipeline_timing_failure.py --out release-checks/timing-failure
          python source/assist/tests/unload_loaded_admission.py --out release-checks/unload-loaded
          node source/suite/tests/console_composition_test.mjs > release-checks/console-composition.log
          node source/suite/tests/console_hotkey_presentation_test.mjs > release-checks/console-hotkeys.log
          git show e802ac9a9a789df2d440b619ac01d741a45079a5:source/assist/source/main.cpp > release-checks/baseline-main.cpp
          python source/assist/tests/superweapon_visibility_entry.py --baseline release-checks/baseline-main.cpp 2>&1 | tee release-checks/superweapon-entry.log
          python source/assist/tests/construction_paint_test.py 2>&1 | tee release-checks/construction.log
          g++ -std=c++17 -O2 -UNDEBUG source/suite/tests/choice_descriptions.cpp -o release-checks/choice-descriptions
          release-checks/choice-descriptions | tee release-checks/choice-descriptions.log
          node source/suite/tests/choice_help_test.mjs | tee release-checks/choice-help.log
          g++ -std=c++17 -O1 -UNDEBUG source/assist/tests/special_unit_visibility.cpp -pthread -ldl -o release-checks/visibility
          release-checks/visibility | tee release-checks/visibility.log
          python source/assist/tests/world_frame_retention.py --out release-checks/retention
          python source/assist/tests/world_frame_core_test.py 2>&1 | tee release-checks/core.log
          python source/assist/tests/mainthread_stall_test.py --out release-checks/stalls 2>&1 | tee release-checks/stalls.log
          python source/assist/tests/attack_ground_policy.py 2>&1 | tee release-checks/own-ground.log
          python source/assist/tests/fps_read_only_recovery.py --out release-checks/fps
          for name in shared_scene_sampling world_ui_sampling single_player_fps pause_view private_outlist; do
            g++ -std=c++17 -O1 -UNDEBUG "source/assist/tests/$name.cpp" -pthread -ldl -o "release-checks/$name"
            "release-checks/$name" | tee "release-checks/$name.log"
          done
          python source/assist/tests/entry_hotpath.py --baseline 061e106b71c81d79ea687edf36ad8401ffb722f8 --out release-checks/entry-hotpath
          python source/assist/tests/object_identity_read.py --baseline 061e106b71c81d79ea687edf36ad8401ffb722f8 --out release-checks/identity
          python source/assist/tests/harvester_defense_runtime.py --out release-checks/harvester > release-checks/harvester.log 2>&1
          python source/assist/tests/tech_parameter_lookup.py --current-only --out release-checks/tech-current
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/entry_policy.cpp -o release-checks/entry-policy
          release-checks/entry-policy
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/entry_thread_identity.cpp -o release-checks/entry-thread
          release-checks/entry-thread
          python source/assist/tests/technology_data_mode.py --cxx /usr/bin/g++ --negative-control --build-dir release-checks/placement-modes
          python source/assist/tests/placement_activation_diagnostic.py --out release-checks/placement-diagnostics
          python source/assist/tests/special_overlay_settings.py --out release-checks/special-settings
          python source/assist/tests/special_overlay_lifecycle.py --out release-checks/special-lifecycle
          python source/suite/tests/console_display_entry_test.py --negative-control --out release-checks/console-display
          python source/assist/tests/overlay_frame_freshness.py --expect-fixed --out release-checks/overlay-freshness
          python source/assist/tests/render_material_settings.py | tee release-checks/render-settings.log
          for name in enemy_markers special_enemy_markers; do
            g++ -std=c++17 -O1 -UNDEBUG "source/assist/tests/$name.cpp" -o "release-checks/$name"
            "release-checks/$name" | tee "release-checks/$name.log"
          done
          g++ -std=c++17 -O1 -UNDEBUG -pthread source/assist/tests/special_unit_overlay.cpp source/third_party/xbrz/xbrz.cpp -ldl -o release-checks/special-unit-overlay
          release-checks/special-unit-overlay | tee release-checks/special-unit-overlay.log
          python source/assist/tests/tactical_frame_sampling.py --out release-checks/tactical
          python source/assist/tests/dodge_compute_routing.py --out release-checks/dodge-routing
          python source/assist/tests/reverse_dodge_hotpath.py --baseline-ref a2c4ed3e2cf3749706d7a60cd4ead6f486fb7db0 --out release-checks/reverse
          g++ -std=c++17 -O2 -UNDEBUG -DMEMCPY_OBSERVATION=1 -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -fno-builtin-memcpy -Wl,--wrap=memcpy -Isource/assist/source source/assist/tests/compute_observation.cpp -o release-checks/observations
          release-checks/observations | tee release-checks/observations.log
          python source/assist/tests/missile_manual_capacity.py --output release-checks/missile-manual > release-checks/missile-manual.log 2>&1
          python source/assist/tests/missile_input_reset.py --out release-checks/missile-reset
          python source/assist/tests/value_task_input.py --current-only --out release-checks/value-input
          g++ -std=c++17 -O2 -UNDEBUG source/assist/tests/missile_allocation_equivalence.cpp -o release-checks/missile-allocator
          release-checks/missile-allocator --no-benchmark | tee release-checks/missile-allocator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA2Toolbox-1.0.51-pre.8-regressions
          retention-days: 30
          path: release-checks/
  release:
    needs: correctness
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: RA2Toolbox-1.0.51-pre.8-regressions
          path: diagnostics-v151pre8/checks
      - name: Install icon encoder
        shell: pwsh
        run: python -m pip install Pillow==11.3.0 playwright==1.56.0
      - name: Install Zig and bind source snapshot
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile zig.zip
          Expand-Archive zig.zip zig
          $zig=(Resolve-Path 'zig/zig-windows-x86_64-0.13.0/zig.exe').Path
          if((& $zig version) -ne '0.13.0'){throw 'Unexpected Zig version'}
          Add-Content $env:GITHUB_ENV "ZIG_EXE=$zig"
          New-Item -ItemType Directory -Force diagnostics-v151pre8,baseline-v150,baseline-v151pre1 | Out-Null
          git show e802ac9a9a789df2d440b619ac01d741a45079a5:source/external_reader/source/world_scene_pipeline.h | Set-Content -Encoding utf8 baseline-v151pre1/world_scene_pipeline.h
          git show e802ac9a9a789df2d440b619ac01d741a45079a5:source/assist/source/watch_scene.h | Set-Content -Encoding utf8 baseline-v151pre1/watch_scene.h
          python .github/scripts/release_151_pre8.py snapshot
          if($LASTEXITCODE -ne 0){throw 'Source snapshot failed'}
      - name: Execute Windows Place transitions and production event path
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          python source/assist/tests/technology_data_mode.py --zig "$ZIG" --negative-control --build-dir diagnostics-v151pre8/checks/placement-modes-windows
          python source/tools/test_native_placement.py --zig "$ZIG" --build-dir diagnostics-v151pre8/checks/native-placement
          python source/assist/tests/overlay_exception_windows.py --zig "$ZIG" --out diagnostics-v151pre8/checks/overlay-exception
          python source/assist/tests/host_crash_windows.py --zig "$ZIG" --out diagnostics-v151pre8/checks/host-crash
          python source/suite/tests/console_icon_visual.py --out diagnostics-v151pre8/checks/console-icon
      - name: Build and verify paired Windows programs
        shell: bash
        run: |
          set -euo pipefail
          export ZIG="$(cygpath -u "$ZIG_EXE")"
          export RA2_CONSOLE_UI=webview2
          export RA2_OUTPUT_DIR="$PWD/build-v151pre8"
          bash source/build-zig-x64.sh > diagnostics-v151pre8/build.log 2>&1 || { tail -100 diagnostics-v151pre8/build.log; exit 1; }
          git restore source/suite/source/app.ico
          python source/tools/verify_windows_outputs.py --root build-v151pre8 --host-arch x64 --webview2 > diagnostics-v151pre8/static-pe.log 2>&1 || { cat diagnostics-v151pre8/static-pe.log; exit 1; }
          cat diagnostics-v151pre8/static-pe.log
      - name: Assemble and verify packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.50 --repo $env:GITHUB_REPOSITORY --dir baseline-v150 --pattern 'RA2Toolbox-1.0.50-x64-*.zip' --pattern 'RA2Toolbox-1.0.50-release-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'Baseline download failed'}
          python .github/scripts/release_151_pre8.py package
          if($LASTEXITCODE -ne 0){throw 'Package verification failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: RA2Toolbox-1.0.51-pre.8-complete-packages
          retention-days: 30
          if-no-files-found: error
          path: dist-v151pre8/
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_151_pre8.py publish
          if($LASTEXITCODE -ne 0){throw 'Publication failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RA2Toolbox-1.0.51-pre.8-release-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            diagnostics-v151pre8/
            dist-v151pre8/source-inputs.json
            dist-v151pre8/publication.json
            dist-v151pre8/*manifest.json
            dist-v151pre8/*SHA256SUMS.txt
