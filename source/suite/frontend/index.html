<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'nonce-ra2-console'; script-src 'self' 'nonce-ra2-console'; img-src data:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>红警工具箱</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工具箱导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">R2</span><div><strong>红警工具箱</strong><span><b id="version">1.0.41-pre.1</b></span></div></div>
      <p class="nav-label">功能设置</p>
      <nav id="navigation" class="navigation" aria-label="功能分类"></nav>
      <div class="sidebar-bottom"><span class="connection-dot" id="connectionDot"></span><span id="connectionText" role="status">正在连接</span><span class="connection-pulse" aria-hidden="true"></span></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><span class="breadcrumb">工具箱<span>/</span><b id="breadcrumb">视频</b></span><div class="topbar-right"><span class="save-state" id="saveState" role="status">设置自动保存</span><button class="text-button save-retry" id="retrySave" type="button" hidden>重试保存</button><span class="quiet-pill">本地控制台</span></div></header>
      <div class="page-heading"><div><p class="eyebrow" id="eyebrow">DISPLAY &amp; VIDEO</p><h1 id="pageTitle">视频</h1><p class="page-description" id="pageDescription">调整画面、光标与监控视图。</p></div><label id="moduleToggleWrap" class="module-toggle" hidden><span id="moduleToggleLabel">启用此模块</span><input id="moduleToggle" type="checkbox" role="switch" aria-label="启用此模块"><span class="switch-track" aria-hidden="true"></span></label></div>
      <div class="page-tools"><div class="tabs" id="videoTabs" role="tablist" aria-label="视频设置"><button type="button" role="tab" data-module="0" aria-selected="true">光标与渲染</button><button type="button" role="tab" data-module="1" aria-selected="false">监控视图</button></div><div id="categoryNote" class="category-note" hidden>每项功能独立启用</div><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg><input id="search" type="search" placeholder="搜索当前页面…" aria-label="搜索当前页面" autocomplete="off"><kbd>Ctrl F</kbd></div></div>
      <div class="page-info"><span id="resultCount">正在载入设置</span><button id="foldAll" class="text-button" type="button" hidden>全部折叠</button></div>
      <div id="debugTools" class="debug-tools" hidden><label>分组<select id="debugGroup" aria-label="调试入口分组"><option value="">全部分组</option></select></label><label>状态<select id="debugFilter" aria-label="调试入口状态"><option value="">全部状态</option><option value="attention">需要关注</option><option value="ready">已就绪 / 可调用</option><option value="blocked">受阻</option><option value="unknown">尚未观测 / 待刷新</option><option value="unchecked">校验关闭</option><option value="unused">未使用</option></select></label><span class="debug-legend">状态自动刷新 · 开关逐项生效</span></div>
      <div id="globalNotice" class="global-notice" role="alert" hidden></div>
      <div class="content-scroll" id="contentScroll" tabindex="-1" role="region" aria-label="功能设置"><div id="settings" class="settings"></div><section id="debugPanel" class="debug-panel" role="table" aria-label="入口状态与签名校验" hidden><div class="debug-columns" role="row"><span role="columnheader">入口 / 地址</span><span role="columnheader">用途 / 影响功能</span><span role="columnheader">当前状态</span><span role="columnheader">校验签名</span></div><div id="debugList" role="rowgroup"></div></section><div id="emptyState" class="empty-state" hidden><span class="empty-icon" aria-hidden="true">⌕</span><h2>没有匹配的设置</h2><p>试试功能名称或其他关键词。</p><button class="subtle-button" id="clearSearch" type="button">清除搜索</button></div><div id="loadingState" class="loading-state"><div class="skeleton-heading"></div><div class="skeleton-row"></div><div class="skeleton-row short"></div><div class="skeleton-row"></div><p id="loadingText">正在连接功能模块…</p></div></div>
      <footer class="statusbar"><div><span class="status-icon" aria-hidden="true"></span><span id="statusText">界面已就绪，正在等待模块状态。</span></div><span id="pendingCount"></span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script src="app.js"></script>
</body>
</html>
